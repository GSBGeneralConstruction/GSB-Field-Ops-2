function renderProjects(){
  const tab = STATE.subtab.projects || 'current';
  const all = [];
  DB.clients.forEach(c=> c.projects.forEach(pr=> all.push({c, pr})));
  const current = all.filter(x=>!x.pr.completed).sort((a,b)=> (b.pr.date||'').localeCompare(a.pr.date||''));
  const completed = all.filter(x=>x.pr.completed).sort((a,b)=> (b.pr.completedDate||'').localeCompare(a.pr.completedDate||''));
  const list = tab==='current' ? current : completed;
  return `
    <h1 class="page-title">Projects</h1>
    <div class="subtle">Every job across every client, in one place.</div>
    <div class="subtabs">
      <button data-subtab="projects:current" class="${tab==='current'?'active':''}">Current (${current.length})</button>
      <button data-subtab="projects:completed" class="${tab==='completed'?'active':''}">Completed (${completed.length})</button>

    ${list.length===0 ? emptyState('Nothing here yet','') : list.map(x=>projectCardHTML(x.c, x.pr, {showClient:true})).join('')}
  `;
}

}

}
const UPLOAD_MAX_BYTES = 700 * 1024; // ~700KB raw file — keeps the base64-encoded version safely under Firestore's 1MB per-document limit
function detectUploadFileType(file){
  const nameLower = file.name.toLowerCase();
  const isPdf = file.type === 'application/pdf' || nameLower.endsWith('.pdf');
  const isWord = file.type === 'application/msword' || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || nameLower.endsWith('.doc') || nameLower.endsWith('.docx');
  if(isPdf) return 'pdf';
  if(isWord) return 'word';
  return null;
}
function downloadDataUrl(dataUrl, fileName){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function uploadedDocPreviewHTML(slotSettings, heightPx){
  if(slotSettings.fileType==='word'){
    return `<div class="banner-note" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <span>📄 <b>${esc(slotSettings.fileName)}</b> — Word documents can't preview inline in the browser, but the file is stored and ready to view.</span>
      <button type="button" class="btn ghost small" data-action="download-uploaded-doc" data-slot="${slotSettings.id}">Download to View</button>
    </div>`;
  }
  return `<iframe src="${slotSettings.dataUrl}" style="width:100%;height:${heightPx}px;border:1px solid var(--line);border-radius:6px;"></iframe>`;
}
function attachLegalDocUploadInputs(){
  ['construction','sub','vendor','estimate'].forEach(slot=>{
    const btn = document.querySelector(`[data-action="trigger-pdf-upload"][data-slot="${slot}"]`);
    const input = document.getElementById('pdf-upload-'+slot);
    if(!btn || !input) return;
    btn.addEventListener('click', ()=> input.click());
    input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const fileType = detectUploadFileType(file);
      if(!fileType){ alert('Please choose a PDF or Word document (.pdf, .doc, or .docx).'); input.value=''; return; }
      if(file.size > UPLOAD_MAX_BYTES){ alert(`That file is too large (${Math.round(file.size/1024)}KB). Please keep uploaded files under ${Math.round(UPLOAD_MAX_BYTES/1024)}KB — a plain text contract is usually well within that.`); input.value=''; return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        const record = { id:slot, mode:'pdf', fileType, fileName:file.name, dataUrl:reader.result, uploadedAt: nowISO() };
        const idx = DB.legalDocSettings.findIndex(s=>s.id===slot);
        if(idx>=0) DB.legalDocSettings[idx]=record; else DB.legalDocSettings.push(record);
        await saveRecord('legalDocSettings', record);
        render();
      };
      reader.readAsDataURL(file);
    });
  });
}

  return `
    <h1 class="page-title">Google Reviews</h1>
    <div class="subtle">Show this to a happy client — they scan, rate, done.</div>
    <div class="qr-box">
      <img src="${GOOGLE_REVIEW_QR}" alt="Scan to leave a Google review">
      <div class="section-label" style="border:none;">Scan to leave us a review</div>
      <div class="mono" style="font-size:12px;word-break:break-all;">${GOOGLE_REVIEW_LINK}</div>

    </div>
  `;
}

/* ================= CALENDAR ================= */
function renderCalendar(){
  const p = perms();
  const events = [...DB.calendarEvents].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const upcoming = events.filter(e=> e.date >= todayStr());
  const past = events.filter(e=> e.date < todayStr());
  return `
    <div class="section-head"><div><h1 class="page-title">Calendar</h1><div class="subtle" style="margin-bottom:0">Inspections, appointments, and job dates.</div></div>
      ${p.calendarManage ? `<button class="btn" data-action="add-calendar-event">+ Add Event</button>` : ''}</div>
    <div class="banner-note">This calendar lives inside the app for now. Once we're on the real backend build, it'll sync both ways with Google Calendar and your Wix booking form, so a time taken here blocks it on your website too.</div>
    <div class="section-label">Upcoming</div>
    <div class="card" style="padding:8px 20px;">
      ${upcoming.length===0 ? emptyState('Nothing scheduled yet','') : upcoming.map(e=>calendarEventRow(e,p)).join('')}
    </div>
    ${past.length>0 ? `
    <div class="section-label">Past</div>
    <div class="card" style="padding:8px 20px;">
      ${past.map(e=>calendarEventRow(e,p)).join('')}
    </div>` : ''}
  `;
}

/* ================= TODAY ================= */
function renderToday(){
  const p = perms();
  const filterId = STATE.todayFilter || STATE.user.id;
  const viewingTeam = DB.team.find(t=>t.id===filterId);
  const viewingLabel = filterId===STATE.user.id ? 'My Tasks' : (viewingTeam ? `${viewingTeam.first} ${viewingTeam.last}'s Tasks` : 'My Tasks');

  const mine = DB.calendarEvents.filter(e => (e.assignedTo||'') === filterId);
  const dueToday = mine.filter(e => e.date === todayStr() && !e.done).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  const overdue = mine.filter(e => e.date < todayStr() && !e.done).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const doneToday = mine.filter(e => e.date === todayStr() && e.done);

  return `
    <div class="section-head"><div><h1 class="page-title">Today</h1><div class="subtle" style="margin-bottom:0">${viewingLabel} — ${fmtDate(todayStr())}</div></div></div>
    ${p.viewAllTasks ? `
      <div class="field" style="max-width:280px;">
        <label>Viewing</label>
        <select id="today-filter-select">
          <option value="${STATE.user.id}" ${filterId===STATE.user.id?'selected':''}>My Tasks</option>
          ${DB.team.filter(t=>t.id!==STATE.user.id).map(t=>`<option value="${t.id}" ${filterId===t.id?'selected':''}>${esc(t.first)} ${esc(t.last)}</option>`).join('')}
        </select>
      </div>` : ''}
    ${overdue.length>0 ? `
    <div class="section-label">Overdue</div>
    <div class="card" style="padding:8px 20px;">
      ${overdue.map(e=>todayTaskRow(e)).join('')}
    </div>` : ''}
    <div class="section-label">Due Today</div>
    <div class="card" style="padding:8px 20px;">
      ${dueToday.length===0 ? emptyState('Nothing due today','') : dueToday.map(e=>todayTaskRow(e)).join('')}
    </div>
    ${doneToday.length>0 ? `
    <div class="section-label">Completed Today</div>
    <div class="card" style="padding:8px 20px;">
      ${doneToday.map(e=>todayTaskRow(e)).join('')}
    </div>` : ''}
  `;
}

/* ---- Signed estimates live on the client's project too (permanent proof) ---- */
function ensureEstimateProject(clients, e){
  const normPhone = (p)=> (p||'').replace(/\D/g,'');
  const normName = (n)=> (n||'').trim().toLowerCase();
  let client = clients.find(cl=>(cl.projects||[]).some(pr=>pr.estimateId===e.id));
  if(client) return {client, changed:false, isNew:false};
  client = clients.find(cl=> normName(cl.name)===normName(e.clientName) && normPhone(cl.primaryPhone)===normPhone(e.clientPhone));
  const project = { id:uid(), projectName: (e.jobName || (e.clientName ? e.clientName+' — Project' : '')), date: (e.date||todayStr()), description: e.constr || e.demo || 'New project',
    contractAmount: totalEstimate(e), estimateSigned:true, contractSigned:false, permitStatus:'not_required', constructionInProgress:false, completed:false, completedDate:null,
    checkupLetterSent:false, warrantyNotes:[], permits:[], inspections:[], beforePhotos:[], afterPhotos:[],
    onsiteId:e.onsiteId||null, estimateId:e.id, contractId:null };
  if(client){ client.projects = client.projects || []; client.projects.push(project); return {client, changed:true, isNew:false}; }
  client = { id:uid(), name:e.clientName, company:'', mailingAddress:e.address||'', propertyAddress:e.address||'',
    primaryPhone:e.clientPhone||'', secondaryPhone:'', email:e.clientEmail||'', preferredContact:'Call', howHeard:'', referredBy:'', notes:'', projects:[project] };
  return {client, changed:true, isNew:true};
}

async function autoCreateOrAttachClient(contract, scans){
  const normPhone = (p)=> (p||'').replace(/\D/g,'');
  const normName = (n)=> (n||'').trim().toLowerCase();
  let client = DB.clients.find(c=> normName(c.name)===normName(contract.clientName) && normPhone(c.primaryPhone)===normPhone(contract.clientPhone));

  const project = { id:uid(), projectName: contract.jobName || (contract.clientName ? contract.clientName+' — Project' : ''), date: todayStr(), description: contract.constr || contract.demo || 'New project', contractAmount: contract.pricing.total,
    estimateSigned:true, contractSigned:true, permitStatus:'not_required', constructionInProgress:false, completed:false, completedDate:null,
    checkupLetterSent:false, warrantyNotes:[], permits:[], inspections:[], beforePhotos:[], afterPhotos:[],
    onsiteId: contract.onsiteId||null, estimateId: contract.estimateId||null, contractId: contract.id };

  const estOwner = contract.estimateId ? DB.clients.find(cl=>(cl.projects||[]).some(pr=>pr.estimateId===contract.estimateId)) : null;
  const estProject = estOwner ? estOwner.projects.find(pr=>pr.estimateId===contract.estimateId) : null;
  if(estProject){
    client = estOwner;
    estProject.contractId = contract.id; estProject.contractSigned = true; estProject.contractAmount = contract.pricing.total;
    pushNotification(`Contract signed — added to ${client.name}'s existing project.`);
  } else if(client){
    client.projects.push(project);
    pushNotification(`Contract signed — new project auto-added to existing client ${client.name}.`);
  } else {
    // pull intake info from linked onsite worksheet if available
    const onsite = contract.onsiteId ? DB.onsite.find(o=>o.id===contract.onsiteId) : null;
    client = { id:uid(), name: contract.clientName, company:'', mailingAddress: contract.address, propertyAddress: contract.address,
      primaryPhone: contract.clientPhone, secondaryPhone:'', email: contract.clientEmail, preferredContact:'Call', howHeard:'Referral', referredBy:'',
      notes: onsite ? ('Captured on-site: '+(onsite.followup||'')) : '', projects:[project] };
    DB.clients.push(client);
    pushNotification(`Contract signed — new client "${client.name}" auto-created with their first project.`);
  }
  if(scans && scans.length){ const tp = estProject || client.projects.find(pr=>pr.contractId===contract.id) || project; tp.signedContractScans = scans; tp.contractId = contract.id; tp.contractSigned = true; }
  await saveRecord('clients', client);

  // everything's now reachable from the project — clear the worksheet, estimate, and contract out of their working lists
  const linkedOnsite = contract.onsiteId ? DB.onsite.find(o=>o.id===contract.onsiteId) : null;
  if(linkedOnsite && !linkedOnsite.archived){ linkedOnsite.archived = true; await saveRecord('onsite', linkedOnsite); }
  const linkedEstimate = contract.estimateId ? DB.estimates.find(e=>e.id===contract.estimateId) : null;
  if(linkedEstimate && !linkedEstimate.archived && linkedEstimate.signedAt){ linkedEstimate.archived = true; await saveRecord('estimates', linkedEstimate); }   // 2.0: an unsigned estimate stays in the list as a reminder
  const liveContract = DB.contracts.find(x=>x.id===contract.id);
  if(liveContract && !liveContract.archived){ liveContract.archived = true; await saveRecord('contracts', liveContract); }
}

(function(){
  function bar(){
    let b = document.getElementById('net-banner');
    if(!b){
      b = document.createElement('div'); b.id = 'net-banner';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;background:#8A5A1B;color:#fff;font:600 12px/1 Inter,sans-serif;text-align:center;padding:6px 10px;display:none;';
      b.textContent = '📴 No signal — you can keep working. Everything saves on this device and sends when you are back online.';
      document.body.appendChild(b);
    }
    return b;
  }
  function update(){ bar().style.display = navigator.onLine ? 'none' : 'block'; }
  window.addEventListener('offline', update);
  window.addEventListener('online', ()=>{
    update();
    try{ if(typeof fbDb !== 'undefined' && fbDb && fbDb.waitForPendingWrites){ fbDb.waitForPendingWrites().then(()=>{ if(typeof showToast==='function') showToast('✓ Back online — your changes are synced'); }).catch(()=>{}); } }catch(e){}
  });
  update();
})();
/* ---- Shows whether this device can start the app with no signal ---- */
(function(){
  async function check(){
    const el = document.getElementById('app-version'); if(!el) return;
    let ready = false;
    try{
      if('serviceWorker' in navigator && navigator.serviceWorker.controller && window.caches){
        const _c = await caches.open('gsb2-field-ops-v1');
        const a = await _c.match('https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js');
        const b = await _c.match('./index.html', {ignoreSearch:true});
        ready = !!(a && b);
      }
    }catch(e){}
    el.textContent = APP_VERSION + (ready ? ' · offline ready ✓' : ' · needs signal to start');
    el.style.color = ready ? '#3F7D4F' : '#B8863A';
    el.style.opacity = '1';
  }
  window.addEventListener('load', ()=>{ setTimeout(check, 2500); setTimeout(check, 9000); });
  if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', ()=>setTimeout(check, 3000));
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
<div id="app-version" style="position:fixed;right:8px;bottom:4px;font:10px/1 Inter,sans-serif;color:#9a9486;opacity:.8;pointer-events:none;z-index:5;">v2.0-2026.11.12-h</div>
