<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSB Field Ops 2.0</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512x512.png">
<link rel="apple-touch-icon" href="./icon-192x192.png">
<meta name="theme-color" content="#7A6A45">


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GSB Field Ops 2.0">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --brown:#7A6A45;
  --brown-dark:#5C4F33;
  --brown-light:#EFEADD;
  --white:#FFFFFF;
  --ink:#2A261E;
  --muted:#8A8371;
  --line:#E4DFD0;
  --warn:#B23A2E;
  --good:#3F7D4F;
  --amber:#B8863A;
  --bg:#FBFAF7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--brown);padding:20px;}
@media print{
  #v2-badge, #app-version, #net-banner, #ob-badge, [data-no-copy]{display:none !important;}
  html, body{background:#fff !important;}
  .login-wrap{min-height:0 !important;display:block !important;background:#fff !important;padding:0 !important;}
  .login-card{box-shadow:none !important;border:0 !important;max-width:none !important;padding:0 !important;border-radius:0 !important;}
  .legal-block{max-height:none !important;overflow:visible !important;}
}
.login-card{background:var(--white);border-radius:12px;padding:36px 34px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
.login-logo{width:150px;display:block;margin:0 auto 6px;}
.login-title{text-align:center;font-family:'Oswald',sans-serif;font-size:15px;color:var(--brown-dark);letter-spacing:0.05em;margin-bottom:22px;}
.login-card .field{margin-bottom:12px;}
.login-card label{display:block;font-size:11px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:5px;}
.login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:15px;}
.login-btn{width:100%;padding:12px;background:var(--brown);color:#fff;border:none;border-radius:6px;font-family:'Oswald',sans-serif;
  text-transform:uppercase;letter-spacing:0.05em;font-size:13px;cursor:pointer;margin-top:6px;}
.login-btn:hover{background:var(--brown-dark);}
.demo-hint{margin-top:20px;background:var(--brown-light);border-radius:8px;padding:12px 14px;font-size:11.5px;color:var(--brown-dark);line-height:1.7;}
.demo-hint b{font-family:'IBM Plex Mono',monospace;}
.login-err{color:var(--warn);font-size:12.5px;margin-top:8px;text-align:center;}

/* ---------- SHELL ---------- */
.topbar{
  background:var(--brown);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 20px 0;
  border-bottom:3px solid var(--brown-dark);position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(42,38,30,0.18);
}
/* 2.0: header = one row (logo · sections · user) + a second row with the pages of the open section */
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px;}
.subnav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--brown-dark);margin:0 -20px;padding:0 14px;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.subnav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#E7E1CF;padding:10px 12px 8px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.subnav button.active{color:#fff;border-bottom-color:#fff;}
.home-section{margin-top:26px;}
.home-section-title{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.home-section .home-grid{margin-top:0;}
@media (max-width:900px){
  .brand-text .t2{display:none;}
  .topbar .nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .topbar .nav::-webkit-scrollbar{display:none;}
  .topbar .nav button{white-space:nowrap;}
}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:34px;}
.brand-text .t1{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.03em;}
.brand-text .t2{font-size:10.5px;color:#E7E1CF;font-family:'IBM Plex Mono',monospace;}
.nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.nav button{
  background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;
  padding:8px 13px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;
}
.nav button.active{background:#fff;color:var(--brown-dark);border-color:#fff;}
.nav button{white-space:nowrap;}
.user-chip{display:flex;align-items:center;gap:10px;}
.role-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(255,255,255,0.18);padding:3px 9px;border-radius:20px;text-transform:uppercase;}
.bell{position:relative;cursor:pointer;width:20px;height:20px;color:#fff;}
.bell-dot{position:absolute;top:-4px;right:-4px;background:var(--warn);color:#fff;font-size:9px;border-radius:50%;
  width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:5px;padding:6px 10px;font-size:11px;cursor:pointer;}

.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px;}
h1.page-title{font-family:'Oswald',sans-serif;font-size:25px;margin:0 0 4px;letter-spacing:0.02em;}
.subtle{color:var(--muted);font-size:13.5px;margin-bottom:20px;}

/* HOME */
.home-hero{text-align:center;padding:6px 0 0;}
.home-hero img{height:72px;margin-bottom:4px;}
.home-hero .name{font-family:'Oswald',sans-serif;font-size:22px;color:var(--brown-dark);letter-spacing:0.03em;}
.home-hero .tag{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:26px;}
.home-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s;overflow:hidden;}
.home-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(122,106,69,0.18);}
.home-card::before{content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:var(--brown);}
.home-card .ic{width:32px;height:32px;color:var(--brown);margin-bottom:10px;}
.home-card h3{font-family:'Oswald',sans-serif;font-size:15px;margin:0 0 5px;letter-spacing:0.02em;}
.home-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.4;}
.home-badge{position:absolute;top:12px;right:12px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.btn{background:var(--brown);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.03em;text-transform:uppercase;}
.btn:hover{background:var(--brown-dark);}
.btn.ghost{background:transparent;color:var(--brown-dark);border:1px solid var(--line);}
.btn.small{padding:6px 11px;font-size:11px;}
.btn.warn{background:var(--warn);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.subtabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
.subtabs button{background:transparent;border:none;padding:9px 4px;margin-right:18px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;position:relative;top:2px;}
.subtabs button.active{color:var(--brown-dark);border-bottom-color:var(--brown);}

.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;}
.list-row:last-child{border-bottom:none;}
.list-row .main b{font-size:14.5px;}
.list-row .main .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.tag{display:inline-block;font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:20px;font-weight:600;}
.tag.pending{background:#F5E9D4;color:var(--amber);}
.tag.reviewed,.tag.ok{background:#DCEADD;color:var(--good);}
.tag.overdue{background:#F3DAD6;color:var(--warn);}
.tag.category{background:var(--brown-light);color:var(--brown-dark);}
.tag.locked{background:#E4DFD0;color:var(--ink);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty svg{width:38px;height:38px;margin-bottom:10px;opacity:0.4;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;}
.chk input{width:16px;height:16px;}
.section-label{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:var(--brown-dark);margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
.section-label:first-child{margin-top:0;}

.detail-panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:6px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:6px;}
.dg-item .k{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
.dg-item .v{font-size:14px;margin-top:2px;}
.dg-item .v.blur{filter:blur(6px);user-select:none;}
.notes-block{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:var(--brown-light);border:1px solid var(--line);border-radius:6px;padding:12px;}

/* lock banner */
.lock-banner{display:flex;align-items:center;gap:10px;border-radius:7px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
.lock-banner.editable{background:#FDF3E3;color:var(--amber);border:1px solid #EAD6A8;}
.lock-banner.locked{background:#EFEBE0;color:var(--ink);border:1px solid var(--line);}

/* progress bar */
.progress-wrap{margin:14px 0 6px;}
.progress-track{display:flex;height:9px;border-radius:20px;overflow:hidden;background:var(--line);}
.progress-seg{flex:1;background:var(--line);border-right:2px solid #fff;}
.progress-seg.on{background:var(--good);}
.progress-seg.partial{background:var(--amber);}
.progress-labels{display:flex;font-size:9.5px;color:var(--muted);margin-top:5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
.progress-labels span{flex:1;text-align:center;}
.stage-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

.timer-box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--brown-light);margin-top:8px;}
.timer-box.due{background:#F8ECE9;border-color:#E3C3BC;}
.timer-num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
.timer-num.due{color:var(--warn);}

.close-x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(42,38,30,0.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--bg);border-radius:10px;max-width:820px;width:100%;padding:26px 28px;margin-bottom:60px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}

.legal-block{font-size:12px;color:var(--ink);line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;max-height:220px;overflow-y:auto;margin-bottom:14px;}
.legal-block h4{font-family:'Oswald',sans-serif;font-size:12px;margin:12px 0 4px;text-transform:uppercase;color:var(--brown-dark);}
.legal-block h4:first-child{margin-top:0;}
.legal-block ul{margin:4px 0;padding-left:18px;}

@media (pointer:coarse){ input:not([type=checkbox]):not([type=radio]), select, textarea{ font-size:16px !important; } }
.sig-pad-wrap{border:1.5px dashed var(--line);border-radius:8px;background:#fff;position:relative;}
canvas.sig-pad{width:100%;height:140px;display:block;touch-action:none;cursor:crosshair;}
.sig-hint{position:absolute;bottom:8px;left:12px;font-size:11px;color:var(--muted);pointer-events:none;}

.notif-panel{position:fixed;top:calc(64px + env(safe-area-inset-top));right:16px;z-index:45;max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;width:320px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);z-index:60;max-height:400px;overflow-y:auto;}
.notif-item{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);}
.notif-item .t{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px;}

table.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
table.hist th{text-align:left;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 6px;}
table.hist td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
.loading{padding:60px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--brown);color:#fff;padding:20px;text-align:center;}
.boot-screen .name{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:0.03em;margin-top:14px;}
.boot-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:boot-spin 0.8s linear infinite;margin-bottom:6px;}
@keyframes boot-spin{to{transform:rotate(360deg);}}
#boot-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E7E1CF;margin-top:12px;min-height:16px;}
.banner-note{background:var(--brown-light);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--brown-dark);margin-bottom:18px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:12px;}
.photo-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.photo-card img{width:100%;height:120px;object-fit:cover;display:block;background:#eee;}
.photo-card .cap-wrap{padding:8px;}
.photo-card input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px;}
.photo-card .rm{width:100%;background:transparent;border:none;color:var(--warn);font-size:11px;padding:4px 8px 0;cursor:pointer;text-align:right;}
.add-photo-btn{border:1.5px dashed var(--line);border-radius:8px;background:#fff;color:var(--brown-dark);padding:14px;width:100%;
  font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;text-align:center;}
/* vendor ranking */
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.star-widget{display:inline-flex;gap:2px;cursor:pointer;}
.star-widget .star{font-size:16px;color:var(--line);}
.star-widget .star.on{color:var(--brown);}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.icon-btn.on.fav{background:#FCE9C6;border-color:#E9C77E;color:#8A6412;}
.icon-btn.on.trust{background:#DCEADD;border-color:#B9DABB;color:var(--good);}
.reliability{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.reliability button{border:none;background:transparent;color:var(--good);cursor:pointer;font-size:11px;padding:0 3px;}
.reliability button.late{color:var(--warn);}
/* projects tab */
.project-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;}
.project-card .pname{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.01em;}
.project-card .pname input{font-family:'Inter',sans-serif;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;}
.client-chip{font-size:11px;color:var(--brown-dark);background:var(--brown-light);border-radius:20px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;}
/* team */
.team-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);}
.team-row:last-child{border-bottom:none;}
.code-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--brown-light);color:var(--brown-dark);padding:3px 10px;border-radius:20px;}
/* reviews QR */
.clock-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:26px;text-align:center;max-width:420px;margin:0 auto 24px;}
.clock-big{font-family:'IBM Plex Mono',monospace;font-size:28px;color:var(--brown-dark);margin:10px 0;}
.shift-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.shift-row:last-child{border-bottom:none;}
.employee-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;cursor:pointer;}
.employee-card:hover{box-shadow:0 6px 16px rgba(122,106,69,0.12);}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;text-align:center;max-width:380px;margin:20px auto;}
.qr-box img{width:220px;height:220px;}
/* floor plan sketch */
img[src^="ref:photos/"]{background:#EEE9DC;min-height:90px;}
.sketch-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;}
.sketch-toolbar-row{background:var(--brown);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sketch-toolbar-row.row2{background:var(--brown-dark);padding:6px 14px;}
.sketch-toolbar .grp, .sketch-toolbar-row .grp{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.1);padding:4px 7px;border-radius:6px;}
.sketch-tool-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 10px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;}
.sketch-tool-btn.active{background:#fff;color:var(--brown-dark);border-color:#fff;}
.sketch-tool-btn.small{padding:5px 8px;font-size:10px;}
.sketch-tool-btn:disabled{opacity:0.35;cursor:not-allowed;}
.sketch-color-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.6);cursor:pointer;flex-shrink:0;}
.sketch-color-dot.active{border-color:#fff;box-shadow:0 0 0 2px var(--brown);}
.sketch-canvas-wrap{flex:1;overflow:auto;background:#EFEADD;display:flex;align-items:flex-start;justify-content:center;padding:20px;touch-action:none;}
canvas.sketch-canvas{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.15);touch-action:none;}

<script>
/* Auto-update: if this device is showing an old saved copy, grab the newest one automatically. */
const APP_VERSION = 'v2.0-2026.11.12-h';
(function(){
  try{
    if(!/^https?:/i.test(location.protocol)) return;
    fetch(location.pathname + '?vcheck=' + Date.now(), {cache:'no-store'})
      .then(r=>r.text())
      .then(t=>{
        const m = t.match(/const APP_VERSION = '([^']+)'/);
        if(m && m[1] !== APP_VERSION && !sessionStorage.getItem('gsb2-reloaded-for-'+m[1])){
          sessionStorage.setItem('gsb2-reloaded-for-'+m[1], '1');
          const done = ()=>{ const u = new URL(location.href); u.searchParams.set('_v', Date.now()); location.replace(u.toString()); };
          const go = ()=>{
            // never reload while someone is drawing a sketch or filling in a worksheet — wait until they are finished
            let busy = false; try{ busy = !!(window.gsbBusy && window.gsbBusy()); }catch(e){}
            if(busy){ setTimeout(go, 15000); return; }
            const jobs = [];
            if(window.caches) jobs.push(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf('gsb2-')===0).map(k=>caches.delete(k)))));   // 2.0: only its OWN saved files — never the original app's
            if(navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>String(r.scope).indexOf('/GSB-Field-Ops-2/')>=0).map(r=>r.unregister()))));
            Promise.all(jobs).catch(()=>{}).then(done);
          };
          go();
        }
      }).catch(()=>{});
  }catch(e){}
})();
</script>

window.onerror = function(msg, src, line, col, err){
  const app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div class="loading">Something went wrong loading the app.<br><span class="mono" style="font-size:11px;">'+
      String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+' (line '+line+')</span><br><br>'+
      '<span style="font-size:12px;">Try reloading the page. If this keeps happening, tell Claude the exact message above.</span></div>';
  }
  return false;
};
</script>

  { id: 'contract-page-1', label: 'Construction Contract — Page 1', content: `## 1. Parties & Project Information

This Agreement is entered into between GSB General Construction Inc ("Contractor") and the Owner named below ("Owner").

  { id: 'contract-page-2', label: 'Construction Contract — Page 2', content: `## 3. Contract Price & Payment Schedule

  { id: 'contract-page-3', label: 'Construction Contract — Page 3', content: `## 7. General Conditions

Not included: architectural/engineering fees, permit fees, modifications from inspector rejection or unexpected structural issues found during demolition, moving/storing furniture, labor for material deliveries.

Labor warrantied 12 months from substantial completion. Manufacturer warranties pass through to Owner. Contractor not responsible for defects in Owner-supplied materials, or damage from normal wear and tear, misuse, or lack of maintenance.

Work is substantially complete when sufficiently finished for its intended use. Contractor and Owner will walk through and prepare a punch list; final payment is due upon completion of punch list items.

Disputes go first to mediation, then binding arbitration in Broward County, FL under AAA rules. The prevailing party may recover reasonable attorney's fees and costs.

## 16. Notice of Consumer Rights — Construction Recovery Fund

FLORIDA HOMEOWNERS' CONSTRUCTION RECOVERY FUND: Payment, up to a limited amount, may be available if you lose money due to specified violations of Florida law by a licensed contractor. Contact the Florida Construction Industry Licensing Board: 2601 Blair Stone Road, Tallahassee, FL 32399-0791, (850) 487-1395.

## 17. Notice to Owner — Construction Lien Law

Under Florida's Construction Lien Law (§713.001–713.37), unpaid subcontractors/suppliers may file a lien against Owner's property even if Owner paid Contractor in full. Owner should require a Release of Lien from anyone who provided a "Notice to Owner" before final payment. Owner is encouraged to consult an attorney.

Required notices must be in writing, delivered by email, text, or mail to the addresses on file, and are considered given when sent.

## 19. Severability

If any provision is found invalid or unenforceable, the remaining provisions remain in full force and effect.

## 20. Waiver

Failure to enforce any provision is not a waiver of that provision or the right to enforce it later.

  const upBtn = document.getElementById(upBtnId), upIn = document.getElementById(upInputId);
  const handle = (input)=> input.addEventListener('change', async (e)=>{ const files = Array.from(e.target.files); input.value = ''; await addPhotosFromFiles(files, getArr(), renderFn); renderFn(); });
  if(camBtn && camIn){ camBtn.addEventListener('click', ()=>camIn.click()); handle(camIn); }
  if(upBtn && upIn){ upBtn.addEventListener('click', ()=>upIn.click()); handle(upIn); }
  renderFn();
}
/* ---- Floor plan files (old / new): pictures or PDFs ---- */
async function processPlanFile(file, kind){
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
  let dataUrl, mime;
  if(isPdf){
    if(file.size > 8*1024*1024) throw new Error('That PDF is over 8 MB. Please send a smaller one (or a photo of the plan).');
    dataUrl = await new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    mime = 'application/pdf';
  } else if(/^image\//.test(file.type)){
    dataUrl = await fileToCompressedDataUrl(file, 2400, 0.8); mime = 'image/jpeg';
  } else throw new Error('Please choose a picture or a PDF.');
  return { id: uid(), kind, name: file.name || 'Floor plan', mime, dataUrl, dateAdded: todayStr(), addedBy: STATE.user ? STATE.user.first : '' };
}

function showFileViewer(f){

  const v = e.target.closest('[data-view-file]');
  if(v){ const f = FILE_REGISTRY[v.dataset.viewFile]; if(f) showFileViewer(f); return; }
  const a = e.target.closest('[data-action="add-plan-file"]');
  if(a){ addPlanFileFlow(Object.assign({}, a.dataset)); return; }
  const r = e.target.closest('[data-rm-plan]');
  if(r){ removePlanFile(r.dataset.rmPlan, Object.assign({}, r.dataset)); return; }
});
function addPlanFileFlow(ds){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*,application/pdf'; inp.multiple = true; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', async ()=>{
    const files = Array.from(inp.files); inp.remove();
    const out = [];
    for(const f of files){ try{ out.push(await processPlanFile(f, ds.kind)); }catch(err){ alert(String(err.message||err)); } }
    if(!out.length) return;
    if(ds.owner === 'new'){ STATE.newPlanFiles.push(...out); renderNewPlanFiles(); scheduleDraftAutosave(); }
    else if(ds.owner === 'onsite'){ const f = DB.onsite.find(x=>x.id===ds.oid); if(!f) return; f.planFiles = (f.planFiles||[]).concat(out); await saveRecord('onsite', f); render(); }
    else if(ds.owner === 'project'){ const c = DB.clients.find(x=>x.id===ds.cid); const pr = c && c.projects.find(x=>x.id===ds.pid); if(!pr) return; pr.planFiles = (pr.planFiles||[]).concat(out); await saveRecord('clients', c); render(); }
  });
  inp.click();
}
async function removePlanFile(fileId, ds){
  if(!confirm('Remove this floor plan file?')) return;
  if(ds.owner === 'new'){ STATE.newPlanFiles = STATE.newPlanFiles.filter(x=>x.id!==fileId); renderNewPlanFiles(); scheduleDraftAutosave(); }
  else if(ds.owner === 'onsite'){ const f = DB.onsite.find(x=>x.id===ds.oid); if(!f) return; f.planFiles = (f.planFiles||[]).filter(x=>x.id!==fileId); await saveRecord('onsite', f); render(); }
  else if(ds.owner === 'project'){ const c = DB.clients.find(x=>x.id===ds.cid); const pr = c && c.projects.find(x=>x.id===ds.pid); if(!pr) return; pr.planFiles = (pr.planFiles||[]).filter(x=>x.id!==fileId); await saveRecord('clients', c); render(); }
}
/* ================= SAVED DRAFTS of the on-site worksheet ================= */
function collectWorksheetForm(){
  const subs = Array.from(document.querySelectorAll('[data-sub]')).filter(c=>c.checked).map(c=>c.dataset.sub);
  const flags = Array.from(document.querySelectorAll('[data-flag]')).filter(c=>c.checked).map(c=>c.dataset.flag);
  const isnew = document.getElementById('os-isnew');
  return {
    date: val('os-date'), clientName: val('os-clientName'), jobName: val('os-jobname'), propertyAddress: val('os-address'), phone: val('os-phone'),
    propType: val('os-propType'), age: val('os-age'), demo: val('os-demo'), constr: val('os-constr'), ep: val('os-ep'), measure: val('os-measure'),
    subs, flags, owner: val('os-owner'), followup: val('os-followup'), isNewClient: !!(isnew && isnew.checked),
    nc: { company: val('os-nc-company'), phone2: val('os-nc-phone2'), email: val('os-nc-email'), preferred: val('os-nc-preferred'), howheard: val('os-nc-howheard'), referred: val('os-nc-referred'), notes: val('os-nc-notes') },
  };
}
function worksheetHasContent(f){
  return !!(f.clientName || f.jobName || f.propertyAddress || f.phone || f.demo || f.constr || f.ep || f.measure || f.owner || f.followup || f.subs.length || f.flags.length
    || STATE.newOnsitePhotos.length || STATE.newOnsiteBeforePhotos.length || STATE.newPlanFiles.length || STATE.newOnsiteFloorPlan);
}
async function saveWorksheetDraft(silent){
  if(!document.getElementById('os-clientName')) return;
  const f = collectWorksheetForm();
  if(!worksheetHasContent(f)){ if(!silent) alert('Nothing to save yet — fill in something first.'); return; }
  if(!STATE.newDraftId) STATE.newDraftId = uid();
  wsMirrorWrite();     // remember which draft this form belongs to
  { const old = DB.onsiteDrafts.find(x=>x.id===STATE.newDraftId);      // safety: a save must never wipe out a sketch/photos that the draft already has
    if(old && !STATE._fpRemoved && !STATE.newOnsiteFloorPlan && old.floorPlan){ STATE.newOnsiteFloorPlan = old.floorPlan; try{ renderNewFloorPlanPreview(); }catch(e){} }
    if(old && !STATE.newOnsitePhotos.length && (old.photos||[]).length && !STATE._photosCleared) STATE.newOnsitePhotos = old.photos.slice();
    if(old && !STATE.newOnsiteBeforePhotos.length && (old.beforePhotos||[]).length && !STATE._photosCleared) STATE.newOnsiteBeforePhotos = old.beforePhotos.slice(); }
  const rec = Object.assign({ id: STATE.newDraftId, deviceId: DEVICE_ID, deviceName: DEVICE_NAME, savedAt: nowISO(), savedBy: STATE.user ? STATE.user.first+' '+STATE.user.last : '' }, f, {
    photos: STATE.newOnsitePhotos.slice(), beforePhotos: STATE.newOnsiteBeforePhotos.slice(), planFiles: STATE.newPlanFiles.slice(), floorPlan: STATE.newOnsiteFloorPlan || null });
  const idx = DB.onsiteDrafts.findIndex(x=>x.id===rec.id);
  if(idx>=0) DB.onsiteDrafts[idx] = rec; else DB.onsiteDrafts.push(rec);
  const _sp = saveRecord('onsiteDrafts', rec);
  await Promise.race([_sp, new Promise(r=>setTimeout(r,1500))]);      // it is already stored on this device by now; do not make the screen wait on a slow connection
  _sp.catch(()=>{});
  { const t = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); paintAutosave(navigator.onLine ? '✓ Auto-saved '+t : '✓ Auto-saved on this device '+t+' — uploads when you are back online'); }
  if(!silent){
    await _sp.catch(()=>{});
    if(navigator.onLine){
      const r = await strictSend('onsiteDrafts', rec);
      if(!r.ok){
        const panel0 = document.getElementById('drafts-panel'); if(panel0) panel0.outerHTML = draftsPanelHTML();
        alert('⚠️ Your worksheet is saved on THIS device only — it did NOT reach the cloud, so it will not show on your other devices yet.\n\nReason: ' + r.err + '\n\nNothing is lost. Tap the “waiting to send” note at the bottom-left to try again, and tell Claude this message.');
        return;
      }
    }
    showToast(navigator.onLine ? '✓ Draft saved — find it under "Saved Drafts" at the top of this page.' : '✓ Draft saved on this device — it will upload when you have signal.');
    const panel = document.getElementById('drafts-panel'); if(panel) panel.outerHTML = draftsPanelHTML();
  }
}
function paintAutosave(txt, bad){
  const el = document.getElementById('autosave-status'); if(!el) return;
  el.textContent = txt; el.style.color = bad ? '#b3261e' : '';
}
function scheduleDraftAutosave(){
  if(!(STATE.view==='onsite' && STATE.subtab.onsite==='new')) return;
  wsMirrorWrite();
  clearTimeout(STATE._draftTimer);
  paintAutosave('Saving…');
  STATE._draftTimer = setTimeout(()=>{ if(STATE.view==='onsite' && STATE.subtab.onsite==='new') saveWorksheetDraft(true); }, 2000);
}

const WS_MIRROR_KEY='gsb2-ws-mirror';
const DEVICE_ID = (()=>{ try{ let v = localStorage.getItem('gsb2-device-id'); if(!v){ v = uid()+uid(); localStorage.setItem('gsb2-device-id', v); } return v; }catch(e){ return 'dev-'+uid(); } })();
const DEVICE_NAME = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) ? 'iPad' : 'Laptop';
function wsMirrorWrite(){
  try{
    if(!(STATE.view==='onsite' && STATE.subtab.onsite==='new' && document.getElementById('os-clientName'))) return;
    const f = collectWorksheetForm();
    if(worksheetHasContent(f)) localStorage.setItem(WS_MIRROR_KEY, JSON.stringify({f, draftId:STATE.newDraftId||null, ts:Date.now()}));
  }catch(e){}
}
function wsMirrorClear(){ try{ localStorage.removeItem(WS_MIRROR_KEY); }catch(e){} }
function wsMirrorRestore(){
  try{
    const cf = collectWorksheetForm();
    if(cf.clientName || cf.jobName || cf.propertyAddress || cf.phone || cf.demo || cf.constr || cf.ep || cf.measure || cf.owner || cf.followup || cf.subs.length || cf.flags.length) return;   // typed text is there already
    const dr = STATE.newDraftId && (DB.onsiteDrafts||[]).find(x=>x.id===STATE.newDraftId);
    if(dr){ fillWorksheetForm(dr); wsMirrorWrite(); return; }
    const m = JSON.parse(localStorage.getItem(WS_MIRROR_KEY)||'null'); if(!m || !m.f) return;
    fillWorksheetForm(m.f); if(m.draftId && !STATE.newDraftId) STATE.newDraftId = m.draftId; wsMirrorWrite();
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) wsMirrorWrite(); });
window.addEventListener('pagehide', wsMirrorWrite);
function resetWorksheetState(){
  wsMirrorClear(); STATE._fpRemoved = false;
  clearTimeout(STATE._draftTimer);
  STATE.newOnsitePhotos = []; STATE.newOnsiteBeforePhotos = []; STATE.newOnsiteFloorPlan = null; STATE.newPlanFiles = []; STATE.newDraftId = null;
}
function fillWorksheetForm(d){
  const set = (id, v)=>{ const el = document.getElementById(id); if(el && v!==undefined && v!==null) el.value = v; };
  set('os-date', d.date); set('os-clientName', d.clientName); set('os-jobname', d.jobName); set('os-address', d.propertyAddress); set('os-phone', d.phone);
  set('os-propType', d.propType); set('os-age', d.age); set('os-demo', d.demo); set('os-constr', d.constr); set('os-ep', d.ep); set('os-measure', d.measure);
  set('os-owner', d.owner); set('os-followup', d.followup);
  document.querySelectorAll('[data-sub]').forEach(c=>{ c.checked = (d.subs||[]).includes(c.dataset.sub); });
  document.querySelectorAll('[data-flag]').forEach(c=>{ c.checked = (d.flags||[]).includes(c.dataset.flag); });
  const nc = d.nc || {};
  set('os-nc-company', nc.company); set('os-nc-phone2', nc.phone2); set('os-nc-email', nc.email); set('os-nc-preferred', nc.preferred);
  set('os-nc-howheard', nc.howheard); set('os-nc-referred', nc.referred); set('os-nc-notes', nc.notes);
  const isnew = document.getElementById('os-isnew');
  if(isnew){ isnew.checked = !!d.isNewClient; isnew.dispatchEvent(new Event('change')); }
  try{ wsMirrorWrite(); }catch(e){}
}


async function continueDraft(id){
  const cur = collectWorksheetForm();
  if(worksheetHasContent(cur)) await saveWorksheetDraft(true);     // keep whatever is open now
  const d = DB.onsiteDrafts.find(x=>x.id===id); if(!d) return;
  // a draft made on ANOTHER device is copied, so editing it here can never overwrite the original over there
  STATE.newDraftId = (d.deviceId && d.deviceId !== DEVICE_ID) ? uid() : d.id;
  STATE.newOnsitePhotos = (d.photos||[]).slice(); STATE.newOnsiteBeforePhotos = (d.beforePhotos||[]).slice();
  STATE.newPlanFiles = (d.planFiles||[]).slice(); STATE.newOnsiteFloorPlan = d.floorPlan || null;
  STATE._fpRemoved = false; STATE.pendingDraftFill = d.id; render();
}
function deleteDraft(id){
  const d = DB.onsiteDrafts.find(x=>x.id===id); if(!d) return;
  if(!confirm('Delete this saved draft'+(d.clientName?' for '+d.clientName:'')+'? This can\'t be undone.')) return;
  DB.onsiteDrafts = DB.onsiteDrafts.filter(x=>x.id!==d.id); deleteRecord('onsiteDrafts', d.id);
  if(STATE.newDraftId===d.id){ STATE.newDraftId = null; wsMirrorClear(); }
  const panel = document.getElementById('drafts-panel'); if(panel) panel.outerHTML = draftsPanelHTML();
}
async function blankWorksheet(){
  const cur = collectWorksheetForm();
  if(worksheetHasContent(cur)) await saveWorksheetDraft(true);
  resetWorksheetState(); render();
}
document.addEventListener('click', (e)=>{
  const c = e.target.closest('[data-action="continue-draft"]'); if(c){ continueDraft(c.dataset.id); return; }
  const d = e.target.closest('[data-action="del-draft"]'); if(d){ deleteDraft(d.dataset.id); return; }
  const n = e.target.closest('[data-action="blank-worksheet"]'); if(n){ blankWorksheet(); return; }
  const pn = e.target.closest('[data-action="pull-now"]'); if(pn){ STATE.pullStatus='Checking…'; pullStatusPaint(); pullFromCloud(true); return; }
});


/* ================= CLOUD FILES: upload on one device, open on any other ================= */
const CLOUD_MAX_MB = 25;
function fmtBytes(n){ n=+n||0; return n<1024? n+' B' : n<1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB'; }
function cloudIcon(t,n){ t=t||''; n=(n||'').toLowerCase(); if(t.startsWith('image/')) return '🖼️'; if(t==='application/pdf'||n.endsWith('.pdf')) return '📕'; if(/xls|csv|sheet/.test(t+n)) return '📊'; if(/doc|word/.test(t+n)) return '📄'; if(t.startsWith('video/')) return '🎞️'; return '📎'; }
function renderCloudFiles(){
  const q = (STATE.cloudQuery||'').toLowerCase();
  const list = DB.cloudFiles.slice().sort((a,b)=>String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||''))).filter(f=>!q || (f.name+' '+(f.label||'')).toLowerCase().includes(q));
  return `
    <h1 class="page-title">☁️ Files</h1>
    <div class="subtle">Upload any file here (PDF, photo, Word, Excel…). It is saved in the cloud and shows up on your iPad, laptop and every other device signed in to the app. Up to ${CLOUD_MAX_MB} MB each.</div>
    <div class="card" style="margin-top:12px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <label class="btn" style="cursor:pointer;">⬆️ Upload files<input type="file" id="cloud-file-input" multiple style="display:none;"></label>
        <input id="cloud-label" placeholder="Optional label (e.g. Smith job)" style="flex:1;min-width:180px;">
        <span id="cloud-status" class="subtle"></span>
      </div>
    </div>
    <div style="margin:12px 0 4px;"><input id="cloud-search" placeholder="Search files…" value="${esc(STATE.cloudQuery||'')}" style="width:100%;max-width:360px;"></div>
    <div class="card" style="padding:8px 20px;">
      ${list.length===0 ? emptyState(q?'No files match':'No files yet','Tap “Upload files” to add your first one.') : list.map(f=>`
        <div class="list-row" style="padding:10px 0;"><div class="main"><div class="pname">${cloudIcon(f.type,f.name)} ${esc(f.name)}</div>
        <div class="meta">${fmtBytes(f.size)} · ${esc(f.uploadedBy||'')} · ${fmtDateTime(f.uploadedAt)}${f.label?' · '+esc(f.label):''}</div></div>
        <div style="display:flex;gap:6px;"><button class="btn small" data-cloud-open="${f.id}">Open</button><button class="btn ghost small" data-cloud-dl="${f.id}">Download</button><button class="btn ghost small" data-cloud-del="${f.id}">Delete</button></div></div>`).join('')}
    </div>`;
}
async function cloudGetData(f){
  let d = f.data;
  if(typeof d==='string' && d.startsWith('ref:photos/')) d = await loadBlob(d.slice(11));
  return d;
}
async function cloudBlobUrl(f){
  const d = await cloudGetData(f); if(!d) return null;

const FS_PREFIX = 'gsb2-data-';   // GSB Field Ops 2.0 — its OWN copy of every collection. The original app uses 'gsb-data-' and is never written to from here.
const ORIG_FS_PREFIX = 'gsb-data-';  // the original app's data — 2.0 only ever READS this (first-run copy, and photos)
// // each key now gets its OWN Firestore collection (e.g. gsb-data-clients) — one document per record, not one shared blob

/* ================= GSB FIELD OPS 2.0 — TEST COPY HELPERS =================
   2.0 has its own copy of every collection ('gsb2-data-…'). It can READ the original app's data ('gsb-data-…')
   to make that copy, but it never writes, changes or deletes anything there. */
const V2_COPIED = {};
async function v2CopyFromOriginal(replace){
  if(FS_PREFIX === ORIG_FS_PREFIX) throw new Error('safety stop: 2.0 is pointed at the original data');
  const keyList = Object.keys(KEYS);
  let done = 0;
  for(const k of keyList){
    setBootStatus('Setting up 2.0 — copying '+KEYS[k]+' from the original app ('+(++done)+'/'+keyList.length+')…');
    const src = await fbDb.collection(ORIG_FS_PREFIX+KEYS[k]).get({source:'server'});
    const dst = fbDb.collection(FS_PREFIX+KEYS[k]);
    const keep = new Set(src.docs.map(d=>d.id));
    if(replace){
      const old = await dst.get({source:'server'});
      const gone = old.docs.filter(d=>!keep.has(d.id));
      for(let i=0;i<gone.length;i+=20) await Promise.all(gone.slice(i,i+20).map(d=>dst.doc(d.id).delete()));
    }
    for(let i=0;i<src.docs.length;i+=20) await Promise.all(src.docs.slice(i,i+20).map(d=>dst.doc(d.id).set(d.data())));
    V2_COPIED[k] = src.docs.map(d=>d.data());
  }
}

    if(el.nodeType!==1 || SKIP.test(el.tagName) || hidden(el)) return;
    if(el.tagName==='IMG') return image(el);
    if(el.tagName==='TABLE') return table(el);
    if(el.tagName==='UL' || el.tagName==='OL') return list(el, 0);
    if(el.tagName==='HR'){ y += 6; return; }
    const kids = Array.prototype.filter.call(el.children, k=>!hidden(k));
    if(kids.length===2 && (kids[0].classList.contains('k') || kids[0].classList.contains('est-k'))){
      const k = pdfCleanText(kids[0].innerText), v = pdfCleanText(kids[1].innerText);
      text(k.charAt(0).toUpperCase()+k.slice(1).toLowerCase()+': '+v, {size:10, after:1}); return;
    }
    if(inlineOnly(el)){
      const st = styleOf(el); let t = el.innerText; if(st.upper) t = t.toUpperCase();
      text(t, {size:st.size, bold:st.bold, color:st.color, align:st.align, rule:st.rule, before:st.before, after: st.bold ? 3 : 4});
      return;
    }
    Array.prototype.forEach.call(el.childNodes, n=>{
      if(n.nodeType===3){ if(n.textContent.trim()) text(n.textContent, {size:10}); }
      else walk(n);
    });
  }
  walk(card);
  const pages = doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
    doc.text('GSB General Construction Inc  •  Florida License #CGC1539336  •  954-605-4746  •  Page '+i+' of '+pages, PW/2, PH - 26, {align:'center'});
  }
  doc.setProperties({title: title});
  return doc.output('blob');
}
function bindPublicCopyButtons(title, fileBase){
  const help = (msg)=>{ const h = document.getElementById('public-print-help'); if(h){ h.innerHTML = msg; h.style.display = 'block'; } };
  const base = String(fileBase||'GSB document').replace(/[\\/:*?"<>|]+/g,'').trim();
  loadJsPdf().catch(()=>{});   // get the PDF tool ready now, so tapping a button opens the menu right away
  const pdfFile = ()=>{
    try{ const blob = buildPdfFromCard(document.querySelector('.login-card'), title); return blob ? new File([blob], base+'.pdf', {type:'application/pdf'}) : null; }
    catch(e){ console.warn('pdf', e); return null; }
  };
  const canShareFile = (f)=>{ try{ return !!(f && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } };
  const saveFile = (f)=>{
    const url = URL.createObjectURL(f);
    const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  };
  // Print
  document.querySelectorAll('[data-action="public-print"]').forEach(el=>el.addEventListener('click', async ()=>{
    if(isAppleTouch()){
      // iPhone/iPad: Safari, Gmail, Outlook and app browsers handle "print" differently — the share menu always has Print.
      if(!(window.jspdf && window.jspdf.jsPDF)){
        help('Getting your copy ready…');
        try{ await loadJsPdf(); }catch(e){ help('Could not prepare the printable copy (no internet?). Please try again in a moment, or tap <b>⬇ Download a Copy</b>.'); return; }
      }
      const f = pdfFile();
      if(f && canShareFile(f)){
        help('In the menu that opens, tap <b>Print</b>. (Scroll the menu down if you don\'t see it.)');
        try{ await navigator.share({files:[f], title}); return; }
        catch(e){ if(e && e.name==='AbortError') return; help('Your printable copy is ready — tap <b>🖨 Print</b> once more, then choose <b>Print</b> in the menu.'); return; }
      }
      if(f){ try{ saveFile(f); help('We saved a printable PDF: <b>'+esc(f.name)+'</b>. Open it from your downloads and tap the share button → <b>Print</b>.'); return; }catch(e){} }
      try{ window.print(); }catch(e){}
      return;
    }
    // Everything else: try the normal print window first. Browsers that really print tell us right away ("beforeprint").
    let opened = false; const mark = ()=>{ opened = true; const h = document.getElementById('public-print-help'); if(h) h.style.display='none'; };
    window.addEventListener('beforeprint', mark);
    try{ window.print(); }catch(e){}
    setTimeout(()=>window.removeEventListener('beforeprint', mark), 5000);
    if(opened) return;
    // No print window here (email-app browser, app view…): hand over a PDF straight away, while the tap still counts.
    let f = (window.jspdf && window.jspdf.jsPDF) ? pdfFile() : null;
    if(!f){ const html = publicCopyHTML(title); if(html) f = new File([new Blob([html], {type:'text/html'})], base+'.html', {type:'text/html'}); }
    if(!f){ help('Could not make a printable copy. Please call GSB General Construction at 954-605-4746 and we will email you one.'); return; }
    if((navigator.maxTouchPoints||0) > 0 && canShareFile(f)){
      help('This browser can\'t print directly, so we made a PDF. In the menu that opens, tap <b>Print</b> (or save it, then print it).');
      try{ await navigator.share({files:[f], title}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    try{
      saveFile(f);
      help('This browser can\'t print directly, so we saved a printable copy: <b>'+esc(f.name)+'</b>. Open it from your downloads and tap Print.');
    }catch(e){
      help('This browser can\'t print. Tap <b>⬇ Download a Copy</b>, open the file, and print it from there.');
    }
  }));
  // Download
  document.querySelectorAll('[data-action="public-download"]').forEach(el=>el.addEventListener('click', async ()=>{
    let f = (window.jspdf && window.jspdf.jsPDF) ? pdfFile() : null;
    if(!f){ try{ await Promise.race([loadJsPdf(), new Promise((_,r)=>setTimeout(()=>r(new Error('slow')), 4000))]); f = pdfFile(); }catch(e){} }
    if(!f){   // no PDF tool (no internet): fall back to a web-page copy
      const html = publicCopyHTML(title);
      if(!html){ help('Could not make a copy. Please call GSB General Construction at 954-605-4746 and we will email you one.'); return; }
      f = new File([new Blob([html], {type:'text/html'})], base+'.html', {type:'text/html'});
    }
    try{
      if((navigator.maxTouchPoints||0) > 0 && canShareFile(f)){ await navigator.share({files:[f], title}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    try{ saveFile(f); help('✓ Your copy was saved (<b>'+esc(f.name)+'</b>). Open it anytime to view or print it.'); }
    catch(e){ help('Could not save here. Open this page in Safari or Chrome and try again, or call us at 954-605-4746 and we will email you a copy.'); }
  }));
}

async function publicAutoCreateOrAttachClient(c){
  // mirrors autoCreateOrAttachClient() but usable from the unauthenticated public page (no DB.* arrays loaded there)
  try{
    const clientsSnap = await fbDb.collection(FS_PREFIX+'clients').get();
    const clients = clientsSnap.docs.map(d=>d.data());
    const normPhone = (p)=> (p||'').replace(/\D/g,'');
    const normName = (n)=> (n||'').trim().toLowerCase();
    let client = clients.find(cl => normName(cl.name)===normName(c.clientName) && normPhone(cl.primaryPhone)===normPhone(c.clientPhone));
    const estOwner = c.estimateId ? clients.find(cl=>(cl.projects||[]).some(pr=>pr.estimateId===c.estimateId)) : null;
    const estProject = estOwner ? estOwner.projects.find(pr=>pr.estimateId===c.estimateId) : null;
    const project = { id: uid(), projectName: c.jobName || (c.clientName ? c.clientName+' — Project' : ''), date:c.date, description:c.constr||c.demo||'New project', contractAmount:c.pricing.total,
      estimateSigned:true, contractSigned:true, permitStatus:'not_required', constructionInProgress:false, completed:false, completedDate:null,
      checkupLetterSent:false, warrantyNotes:[], permits:[], inspections:[], beforePhotos:[], afterPhotos:[],
      onsiteId:c.onsiteId||null, estimateId:c.estimateId||null, contractId:c.id };
    if(estProject){
      client = estOwner;
      estProject.contractId = c.id; estProject.contractSigned = true; estProject.contractAmount = c.pricing.total;
    } else if(client){
      client.projects = client.projects || [];
      client.projects.push(project);
    } else {
      client = { id: uid(), name:c.clientName, company:'', mailingAddress:c.address, propertyAddress:c.address,
        primaryPhone:c.clientPhone, secondaryPhone:'', email:c.clientEmail||'', preferredContact:'Call', howHeard:'Referral', referredBy:'',
        notes:'', projects:[project] };
    }
    await fbDb.collection(FS_PREFIX+'clients').doc(client.id).set(client);
    // clear the worksheet, estimate, and contract out of their working lists — now reachable from the project
    const jobs = [];
    if(c.onsiteId) jobs.push(fbDb.collection(FS_PREFIX+'onsite-estimates').doc(c.onsiteId).update({archived:true}).catch(()=>{}));
    if(c.estimateId) jobs.push(fbDb.collection(FS_PREFIX+'estimates').doc(c.estimateId).update({archived:true}).catch(()=>{}));
    jobs.push(fbDb.collection(FS_PREFIX+'contracts').doc(c.id).update({archived:true}).catch(()=>{}));
    await Promise.all(jobs);
  }catch(err){ console.error('publicAutoCreateOrAttachClient failed', err); }
}

// Firestore keeps every write on this device first and sends it when there is signal. Without signal the "done" never comes back,
// so we stop waiting after a moment (the write is still safely queued and goes out on its own later).
function fsWrite(promise){
  promise.catch(e=>noteWriteError(e));
  return Promise.race([promise, new Promise(r=>setTimeout(r, navigator.onLine ? 8000 : 250))]).catch(()=>{});
}

/* ================= SEND-CHECK ("outbox") =================
   Every save is first kept in a little box on this device and only removed once the cloud confirms it received it.
   If a save never reaches the cloud (no signal, app closed too soon, blocked), it stays in the box and shows
   "waiting to send" at the bottom-left — tap it to send right away. It also retries by itself when the app opens. */
const OB = {
  db:null,
  open(){
    if(OB.db) return Promise.resolve(OB.db);
    return new Promise((res)=>{
      try{
        const rq = indexedDB.open('gsb2-outbox', 1);
        rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('q', {keyPath:'key'}); };
        rq.onsuccess = ()=>{ OB.db = rq.result; res(OB.db); };
        rq.onerror = ()=>res(null);
      }catch(e){ res(null); }
    });
  },
  async tx(mode, fn){
    const db = await OB.open(); if(!db) return null;
    return new Promise((res)=>{ try{ const t = db.transaction('q', mode); const r = fn(t.objectStore('q')); t.oncomplete = ()=>res(r && 'result' in r ? r.result : true); t.onerror = ()=>res(null); t.onabort = ()=>res(null); }catch(e){ res(null); } });
  },
  put(k,id,rec){ let copy; try{ copy = JSON.parse(JSON.stringify(rec)); }catch(e){ return Promise.resolve(); } return OB.tx('readwrite', s=>s.put({key:k+'/'+id, k, id:String(id), rec:copy, ts:Date.now()})); },
  del(k,id){ return OB.tx('readwrite', s=>s.delete(k+'/'+id)); },
  all(){ return OB.tx('readonly', s=>s.getAll()).then(r=>Array.isArray(r)?r:[]); },
};
function explainSendError(e){
  const c = (e && e.code) || '';
  if(c==='unavailable' || c==='timeout' || /network|offline|connection/i.test((e&&e.message)||'')) return 'cannot reach the cloud (connection problem — try another Wi-Fi or cellular data, and turn off any VPN / content blocker)';
  if(c==='permission-denied') return 'the cloud database blocked it (permission) — tell Claude';
  if(c==='invalid-argument' || /too large|exceeds/i.test((e&&e.message)||'')) return 'the record is too big for the cloud';
  return (c||'error') + ': ' + ((e&&e.message)||e);
}
/* Backup route: send straight to the cloud over a normal web request (not the live connection), for devices where the live connection is blocked */
function toFsValue(v){
  if(v===null || v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number'){ if(!isFinite(v)) return {nullValue:null}; return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v}; }
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(toFsValue)}};
  if(typeof v==='object'){ const f = {}; Object.keys(v).forEach(k=>{ if(v[k]!==undefined) f[k] = toFsValue(v[k]); }); return {mapValue:{fields:f}}; }
  return {stringValue:String(v)};
}
async function restSet(coll, id, obj){
  const user = fbAuth && fbAuth.currentUser; if(!user) throw Object.assign(new Error('not signed in'), {code:'unauthenticated'});
  const token = await user.getIdToken();
  const fields = {}; Object.keys(obj).forEach(k=>{ if(obj[k]!==undefined) fields[k] = toFsValue(obj[k]); });
  const url = 'https://firestore.googleapis.com/v1/projects/' + firebaseConfig.projectId + '/databases/(default)/documents/' + encodeURIComponent(coll) + '/' + encodeURIComponent(String(id));
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null; const t = setTimeout(()=>{ try{ctl&&ctl.abort();}catch(e){} }, 45000);
  let res;
  try{ res = await fetch(url, {method:'PATCH', headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'}, body: JSON.stringify({fields}), signal: ctl?ctl.signal:undefined}); }
  catch(e){ clearTimeout(t); throw Object.assign(new Error('web request failed: '+(e.message||e)), {code:'unavailable'}); }
  clearTimeout(t);
  if(!res.ok){ let msg=''; try{ const j = await res.json(); msg = (j.error && (j.error.status+': '+j.error.message)) || ''; }catch(e){} throw Object.assign(new Error('HTTP '+res.status+' '+msg), {code: res.status===403?'permission-denied':(res.status===400?'invalid-argument':'http-'+res.status)}); }
}
async function restSendBlobs(blobs){
  for(const b of blobs){
    const n = Math.ceil(b.data.length/BLOB_CHUNK);
    if(n <= 1) await restSet(BLOB_COLL, b.id, {id:b.id, n:1, d:b.data});
    else { await restSet(BLOB_COLL, b.id, {id:b.id, n}); for(let i=0;i<n;i++) await restSet(BLOB_COLL, b.id+'_'+i, {id:b.id+'_'+i, d:b.data.slice(i*BLOB_CHUNK,(i+1)*BLOB_CHUNK)}); }
    BLOB_SAVED.add(b.id);
  }
}
async function strictSend(k, rec){
  const id = rec[RECORD_ID_FIELD[k]];
  let toWrite = rec, blobs = [];
  try{ if(BLOB_KEYS.includes(k)){ BLOB_SAVED.clear(); const ex = externalizeBlobs(rec); toWrite = ex.copy; blobs = ex.blobs; } }catch(e){}
  let sdkErr = null;
  try{
    for(const bl of blobs){ await writeBlobsStrict(bl); }
    await Promise.race([collectionFor(k).doc(String(id)).set(toWrite), new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('no answer from the cloud'),{code:'timeout'})),12000))]);
    await OB.del(k, id);
    return {ok:true};
  }catch(e){ sdkErr = e; }
  // backup route
  try{
    await restSendBlobs(blobs);
    await restSet(FS_PREFIX + KEYS[k], id, toWrite);
    await OB.del(k, id);
    return {ok:true, via:'backup'};
  }catch(e2){
    return {ok:false, err: explainSendError(e2) + ' [live: ' + ((sdkErr&&sdkErr.code)||'?') + ' / backup: ' + (e2.message||e2.code) + ']', raw:e2};
  }
}

/* ================= PULL BACKUP: bring in what other devices saved, over a normal web request =================
   Same idea as the "send" backup route, but for receiving: this works even when the live connection is blocked on a device. */
function fromFsValue(v){
  if(!v) return null;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  if('timestampValue' in v) return v.timestampValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFsValue);
  if('mapValue' in v){ const o={}; const f=v.mapValue.fields||{}; Object.keys(f).forEach(k=>o[k]=fromFsValue(f[k])); return o; }
  return null;
}
async function restList(coll){
  const user = fbAuth && fbAuth.currentUser; if(!user) throw new Error('not signed in');
  const token = await user.getIdToken();
  let out = [], pageToken = '';
  for(let i=0;i<20;i++){
    const url = 'https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+'/databases/(default)/documents/'+encodeURIComponent(coll)+'?pageSize=200'+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null; const t = setTimeout(()=>{ try{ctl&&ctl.abort();}catch(e){} }, 30000);
    let res; try{ res = await fetch(url, {headers:{'Authorization':'Bearer '+token}, signal: ctl?ctl.signal:undefined}); } finally { clearTimeout(t); }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    (j.documents||[]).forEach(d=>{ const o={}; const f=d.fields||{}; Object.keys(f).forEach(k=>o[k]=fromFsValue(f[k])); out.push(o); });
    pageToken = j.nextPageToken || ''; if(!pageToken) break;
  }
  return out;
}
async function restDelete(coll, id){
  const user = fbAuth && fbAuth.currentUser; if(!user) return false;
  const token = await user.getIdToken();
  const url = 'https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+'/databases/(default)/documents/'+encodeURIComponent(coll)+'/'+encodeURIComponent(String(id));
  const res = await fetch(url, {method:'DELETE', headers:{'Authorization':'Bearer '+token}});
  return res.ok || res.status===404;
}
let _pulling = false, _lastPull = 0;
async function pullFromCloud(manual){
  if(_pulling || !STATE.user || !STATE.loaded) return;
  if(!navigator.onLine){ STATE.pullStatus = 'No internet right now.'; pullStatusPaint(); return; }
  if(document.hidden && !manual) return;
  _pulling = true; _lastPull = Date.now();
  try{
    const pend = new Set((await OB.all()).map(x=>x.key));
    let draftsChanged = false, otherChanged = false;
    for(const k of ['onsiteDrafts','onsite','estimates','clients','contracts','changeOrders']){
      const tPull = Date.now();
      let remote; try{ remote = await restList(FS_PREFIX+KEYS[k]); }catch(e){ if(k==='onsiteDrafts') STATE.pullStatus = 'Could not read drafts from the cloud: '+(e.message||e); continue; }
      if(k==='onsiteDrafts') STATE.pullStatus = remote.length+' draft'+(remote.length===1?'':'s')+' found in the cloud';
      const idf = RECORD_ID_FIELD[k];
      const t0 = tPull;
      const pendNow = new Set((await OB.all()).map(x=>x.key));
      const tb = tombs(); let tbChanged = false;
      const remoteIds = new Set(remote.map(r=>String(r[idf])));
      Object.keys(tb).forEach(key=>{ if(key.startsWith(k+'/') && !remoteIds.has(key.slice(k.length+1))){ delete tb[key]; tbChanged = true; } });   // gone from the cloud: forget it
      if(tbChanged) tombSet(tb);
      for(const rec of remote){
        const id = rec[idf]; if(id===undefined || id===null) continue;
        if(tb[k+'/'+id]){ try{ restDelete(FS_PREFIX+KEYS[k], id); }catch(e){} continue; }          // deleted on this device: keep it deleted
        if(k==='onsite' && STATE.pricingCalcOnsiteId && id===STATE.pricingCalcOnsiteId) continue;   // being edited in the calculator right now
        if((LOCAL_TOUCH[k+'/'+id]||0) >= t0) continue;                                              // changed here while this check was running
        if(pendNow.has(k+'/'+id) && !pend.has(k+'/'+id)) continue;
        if(pend.has(k+'/'+id)){
          const loc = DB[k].find(x=>x[idf]===id);
          const newerRemote = k==='onsiteDrafts' && loc && String(rec.savedAt||'') > String(loc.savedAt||'');
          if(!newerRemote) continue;                                       // we have a newer unsent copy
          try{ await OB.del(k, id); }catch(e){}                            // the cloud copy is newer than our stuck one: take the cloud copy
        }
        if(k==='onsiteDrafts' && id===STATE.newDraftId && document.getElementById('os-clientName')) continue;   // the one you're typing in
        const i = DB[k].findIndex(x=>x[idf]===id);
        if(i<0){ DB[k].push(rec); (k==='onsiteDrafts' ? draftsChanged=true : otherChanged=true); }
        else if(JSON.stringify(DB[k][i]) !== JSON.stringify(rec)){
          const cur = DB[k][i]; Object.keys(cur).forEach(key=>{ if(!(key in rec)) delete cur[key]; }); Object.assign(cur, rec);
          (k==='onsiteDrafts' ? draftsChanged=true : otherChanged=true);
        }
      }
    }
    STATE.pullTime = new Date();
    if(draftsChanged){ const panel = document.getElementById('drafts-panel'); if(panel) panel.outerHTML = draftsPanelHTML(); }
    if((otherChanged || (draftsChanged && !document.getElementById('drafts-panel'))) && STATE.user){ if(safeToRerender()) render(); else STATE.pendingRender = true; }
  }catch(e){ console.warn('pull', e); STATE.pullStatus = 'Check failed: '+(e.message||e); }
  _pulling = false; pullStatusPaint();
}
function pullStatusPaint(){ const el = document.getElementById('pull-status'); if(el) el.textContent = (STATE.pullStatus||'') + (STATE.pullTime ? ' · checked '+STATE.pullTime.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}) : ''); }
setInterval(()=>{ if(Date.now()-_lastPull > 25000) pullFromCloud(); }, 8000);

let _obReplaying = false;
async function obUpdateBadge(){
  let b = document.getElementById('ob-badge');

  if(!items.length){ if(b) b.style.display='none'; return; }

    b.addEventListener('click', ()=>{ replayOutbox(true); });
    document.body.appendChild(b);

async function replayOutbox(force){
  if(typeof fbDb==='undefined' || !fbDb) return;
  if(_obReplaying){ if(force) showToast('Already sending — one moment…'); return; }
  if(!navigator.onLine){ if(force) showToast('No signal yet — it will send automatically when you are back online.'); return; }
  _obReplaying = true;
  try{
    const items = (await OB.all()).filter(x=>x.k!=='notifications');
    let sent = 0; const fails = [];
    for(const it of items){
      try{
        let missing = true;
        if(!force){
          try{ const snap = await Promise.race([collectionFor(it.k).doc(it.id).get({source:'server'}), new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')),8000))]); missing = !snap.exists; }catch(e){ missing = false; }
        }
        if(force || missing){
          const idf = RECORD_ID_FIELD[it.k]; const cur = DB[it.k] && DB[it.k].find(x=>String(x[idf])===it.id);
          if(!(DB[it.k]||[]).some(x=>String(x[idf])===it.id)){ DB[it.k].push(it.rec); }
          const r = await strictSend(it.k, (force && cur) ? cur : it.rec);
          if(r.ok) sent++; else { fails.push(r.err); }
        }
      }catch(e){ console.warn('outbox replay', e); }
    }
    await obUpdateBadge();
    if(force){ const left = (await OB.all()).filter(x=>x.k!=='notifications').length; showToast(left ? ('Not sent: '+(fails[0]||'unknown problem')+'. Nothing is lost — it stays saved on this device.') : '✓ Everything is sent to the cloud.'); }
    else if(sent){ showToast('✓ Sent '+sent+' saved change'+(sent>1?'s':'')+' that had not reached the cloud yet.'); try{ render(); }catch(e){} }
  } finally { _obReplaying = false; }
}

const LOCAL_TOUCH = {};   // key -> time this device last saved/deleted it (so a slow "pull" can never bring back an older copy)
const TOMB_KEY = 'gsb2-deleted-ids';
function tombs(){ try{ return JSON.parse(localStorage.getItem(TOMB_KEY)||'{}'); }catch(e){ return {}; } }
function tombSet(t){ try{ localStorage.setItem(TOMB_KEY, JSON.stringify(t)); }catch(e){} }
async function saveRecord(k, record){
  try{ LOCAL_TOUCH[k+'/'+record[RECORD_ID_FIELD[k]]] = Date.now(); const t = tombs(); const kk = k+'/'+record[RECORD_ID_FIELD[k]]; if(t[kk]){ delete t[kk]; tombSet(t); } }catch(e){}
  const idField = RECORD_ID_FIELD[k];
  const id = record[idField];
  if(id===undefined || id===null || id===''){ console.error('saveRecord: missing id field for', k, record); return; }
  try{
    let toWrite = record;
    if(BLOB_KEYS.includes(k)){
      const ex = externalizeBlobs(record);
      toWrite = ex.copy;
      if(ex.blobs.length) await writeBlobs(ex.blobs);
    }
    await OB.put(k, id, record);
    const wp = collectionFor(k).doc(String(id)).set(toWrite);
    wp.then(()=>{ OB.del(k, id).then(()=>obUpdateBadge()); }).catch(()=>{});
    await fsWrite(wp);
    obUpdateBadge();
  }
  catch(e){ console.error('saveRecord failed for', k, id, e); }
}
async function deleteRecord(k, id){
  try{ LOCAL_TOUCH[k+'/'+id] = Date.now(); const t = tombs(); t[k+'/'+id] = Date.now(); tombSet(t); }catch(e){}
  try{ await OB.del(k, id); }catch(e){}
  try{ await fsWrite(collectionFor(k).doc(String(id)).delete()); }
  catch(e){ console.error('deleteRecord failed for', k, id, e); }
}
// Bulk save every record currently in DB[k] as its own document — used for first-run seeding and one-time migrations, not regular UI edits.
async function save(k){
  const idField = RECORD_ID_FIELD[k];
  try{
    const prep = DB[k].map(record=>{
      if(!BLOB_KEYS.includes(k)) return { id:String(record[idField]), data:record, blobs:[] };
      const ex = externalizeBlobs(record); return { id:String(record[idField]), data:ex.copy, blobs:ex.blobs };
    });
    const allBlobs = prep.flatMap(p=>p.blobs);
    if(allBlobs.length) await writeBlobs(allBlobs);
    await fsWrite(Promise.all(prep.map(p => collectionFor(k).doc(p.id).set(p.data))));
  }
  catch(e){ console.error('Bulk save failed for', k, e); }
}
async function saveAll(){ for(const k of Object.keys(KEYS)) await save(k); }

/* ---- iPad/iPhone keyboard helpers ----
   iOS only shows the keyboard when focus happens inside a real tap. Fields focused by code (e.g. sketch popups)
   end up "focused" with no keyboard, and tapping an already-focused field does nothing. These fix both cases. */
function keyboardLooksHidden(){
  const vv = window.visualViewport;
  return !vv || vv.height > window.innerHeight * 0.9;
}
function isTextField(el){
  if(!el || !el.matches) return false;
  if(el.matches('textarea')) return true;
  if(!el.matches('input')) return false;
  return !/^(checkbox|radio|file|range|button|submit|color|date|time|datetime-local|hidden)$/i.test(el.type||'text');
}
function focusWithKeyboard(input){
  if(!input) return;
  input.focus();
  try{ input.select(); }catch(e){}
}
document.addEventListener('touchend', (e)=>{
  const t = e.target;
  if(isTextField(t) && document.activeElement===t && keyboardLooksHidden()){
    const start = t.selectionStart, end = t.selectionEnd;
    t.blur(); t.focus();
    try{ if(start!=null) t.setSelectionRange(start, end); }catch(_){}
  }
}, true);

function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio; canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#2A261E'; ctx.lineWidth = 2.2; ctx.lineJoin='round'; ctx.lineCap='round';
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const p = e.touches? e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
  function start(e){ fixSignaturePad(canvas); drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); const cx=canvas._ctx||ctx; cx.beginPath(); cx.moveTo(last.x,last.y); cx.lineTo(p.x,p.y); cx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  canvas._ctx = ctx; canvas.style.touchAction='none';
}
// Re-sizes a signature pad if its on-screen size changed after it was set up (e.g. after a popup closed or the iPad rotated) so it always accepts drawing
function fixSignaturePad(canvas){
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth*ratio, h = canvas.clientHeight*ratio;
  if(w && h && (Math.abs(canvas.width-w)>2 || Math.abs(canvas.height-h)>2)){
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d'); ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.strokeStyle='#2A261E'; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.lineCap='round'; canvas._ctx = ctx;
  }
}
function fixAllSignaturePads(){ document.querySelectorAll('canvas.sig-pad').forEach(fixSignaturePad); }
window.addEventListener('resize', fixAllSignaturePads); window.addEventListener('orientationchange', ()=>setTimeout(fixAllSignaturePads,300));
function clearSignature(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function sk2NewPlan(){ return { v:2, shapes:[], openings:[], boxes:[], columns:[], notes:[] }; }
function sk2Uid(){ return 'k'+Math.random().toString(36).slice(2,10); }

/* ---- reading a length: the T1R types 12' 4 3/8" — also accepts 148 3/8", 12.5', 12 4, 3.76 m, 376 cm ---- */
function sk2ParseLen(input){
  let s = String(input==null?'':input).trim().toLowerCase();
  if(!s) return null;
  s = s.replace(/[’′‘`]/g,"'").replace(/[”″“]/g,'"').replace(/''/g,'"').replace(/,/g,'.').replace(/\s+/g,' ');
  let m = s.match(/^(\d+(?:\.\d+)?)\s*(mm|cm|m)$/);
  if(m){ const v = parseFloat(m[1]); return m[2]==='mm' ? v/25.4 : m[2]==='cm' ? v/2.54 : v*39.3700787; }
  let feet = 0, hadFeet = false, hadInchMark = /"|\bin\b|inch/.test(s);
  m = s.match(/(\d+(?:\.\d+)?)\s*(?:'|ft\b|feet\b|foot\b)/);
  if(m){ feet = parseFloat(m[1]); hadFeet = true; s = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).trim(); }
  s = s.replace(/"|\binches\b|\binch\b|\bin\b/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  let inches = 0;
  if(s && !hadFeet && !hadInchMark){
    const parts = s.split(' ');
    if(parts.length===2 && /^\d+(\.\d+)?$/.test(parts[0]) && /^\d+(\.\d+)?$/.test(parts[1])){ const v = parseFloat(parts[0])*12 + parseFloat(parts[1]); return v > 0 ? v : null; }
  }
  if(s){
    m = s.match(/^(\d+(?:\.\d+)?)?(?:\s*(\d+)\/(\d+))?$/);
    if(!m) return null;
    const whole = m[1]!=null ? parseFloat(m[1]) : 0;
    const frac = m[2]!=null ? (parseInt(m[3],10) ? parseInt(m[2],10)/parseInt(m[3],10) : NaN) : 0;
    if(isNaN(frac)) return null;
    if(m[1]==null && m[2]==null) return hadFeet ? feet*12 : null;
    if(!hadFeet && !hadInchMark){
      // bare numbers (typed by hand): "12" = 12 ft, "12.5" = 12.5 ft, "12 4" = 12 ft 4 in, "3/8" = inches
      if(m[2]==null) return whole > 0 ? whole*12 : null;
    }
    inches = whole + frac;
  }
  const total = feet*12 + inches;
  return total > 0 ? total : null;
}
function sk2Fmt(inches, approx){
  if(inches==null || !isFinite(inches)) return '—';
  let n = Math.round(inches*16);              // nearest 1/16"
  const neg = n < 0; n = Math.abs(n);
  let ft = Math.floor(n/(12*16)); n -= ft*12*16;

/* ---------- view ---------- */
function sk2W2S(p){ const v = STATE.sk2.view; return { x:p.x*v.s + v.ox, y:p.y*v.s + v.oy }; }
function sk2S2W(p){ const v = STATE.sk2.view; return { x:(p.x - v.ox)/v.s, y:(p.y - v.oy)/v.s }; }
function sk2Bounds(plan){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  const add = (x,y)=>{ minx=Math.min(minx,x); miny=Math.min(miny,y); maxx=Math.max(maxx,x); maxy=Math.max(maxy,y); };
  plan.shapes.forEach(sh=>sh.pts.forEach(p=>add(p.x,p.y)));
  plan.boxes.forEach(b=>{ const r = Math.hypot(b.w,b.d)/2; add(b.x-r,b.y-r); add(b.x+r,b.y+r); });
  plan.columns.forEach(c=>{ const q = sk2ColPos(plan, c); add(q.x-c.size,q.y-c.size); add(q.x+c.size,q.y+c.size); });
  plan.notes.forEach(n=>{ add(n.x,n.y); add(n.x+60,n.y+12); });
  return isFinite(minx) ? {minx,miny,maxx,maxy} : null;
}
function sk2Fit(){
  const S = STATE.sk2; const cv = document.getElementById('sk2-canvas'); if(!cv) return;
  const r = cv.getBoundingClientRect(), W = r.width||800, H = r.height||600;
  const b = sk2Bounds(S.plan);
  if(!b){ S.view = { s:2, ox:W/2 - 120*2, oy:H/2 - 90*2 }; return; }
  const bw = Math.max(48, b.maxx-b.minx), bh = Math.max(48, b.maxy-b.miny);
  const s = Math.max(0.4, Math.min(8, Math.min((W-120)/bw, (H-120)/bh)));
  S.view = { s, ox: W/2 - (b.minx+bw/2)*s, oy: H/2 - (b.miny+bh/2)*s };
}
function sk2ZoomAt(x, y, f){
  const v = STATE.sk2.view; const ns = Math.max(0.3, Math.min(12, v.s*f)); const k = ns/v.s;
  v.ox = x - (x - v.ox)*k; v.oy = y - (y - v.oy)*k; v.s = ns; sk2Draw();

/* ---------- drawing ---------- */
function sk2Draw(target){

  const cv = target ? target.canvas : document.getElementById('sk2-canvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = target ? 1 : (window.devicePixelRatio||1);
  const view = target ? target.view : S.view;
  const W2S = (p)=>({ x:p.x*view.s + view.ox, y:p.y*view.s + view.oy });
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const CW = cv.width/dpr, CH = cv.height/dpr;

    ctx.strokeStyle = '#EEE9DD'; ctx.beginPath();
    for(let x=x0; x<CW; x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,CH); }
    for(let y=y0; y<CH; y+=step){ ctx.moveTo(0,y); ctx.lineTo(CW,y); }
    ctx.stroke();

  const plan = S.plan, sel = target ? null : S.sel;
  const wallPx = Math.max(3, 4.5*view.s);

  plan.shapes.forEach(sh=>{
    if(!sh.closed) return;
    ctx.beginPath(); sh.pts.forEach((p,i)=>{ const q = W2S(p); i ? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y); }); ctx.closePath();
    ctx.fillStyle = (sel && sel.kind==='room' && sel.sid===sh.id) ? 'rgba(46,92,138,0.14)' : 'rgba(122,106,69,0.06)'; ctx.fill();
  });

  plan.shapes.forEach(sh=>{
    const n = sk2SegCount(sh);
    const cen = sh.closed ? sk2Centroid(sh) : null;
    for(let i=0;i<n;i++){
      const [a,b] = sk2SegEnds(sh,i), len = sk2V.dist(a,b); if(len < 1e-6) continue;
      const ops = plan.openings.filter(o=>o.sid===sh.id && o.seg===i).map(o=>({o, t0:Math.max(0,o.t - (o.w/2)/len), t1:Math.min(1,o.t + (o.w/2)/len)})).sort((x,y)=>x.t0-y.t0);
      const at = (t)=>W2S({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
      let t = 0; const pieces = [];
      ops.forEach(x=>{ if(x.t0 > t) pieces.push([t, x.t0]); t = Math.max(t, x.t1); }); if(t < 1) pieces.push([t,1]);
      const isSel = sel && sel.kind==='wall' && sel.sid===sh.id && sel.seg===i;
      const isPick = S.picks.some(p=>p.sid===sh.id && p.seg===i);
      ctx.lineCap = 'square'; ctx.lineWidth = wallPx; ctx.strokeStyle = isSel ? '#1F6FD1' : isPick ? '#D9822B' : '#2A261E';
      pieces.forEach(([u,v])=>{ const p = at(u), q = at(v); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); });
      // doors & windows
      const dir = sk2V.norm(sk2V.sub(b,a));
      let nrm = {x:-dir.y, y:dir.x};
      if(cen){ const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; if(sk2V.dot(sk2V.sub(cen, mid), nrm) < 0) nrm = {x:-nrm.x, y:-nrm.y}; }   // points into the room
      ops.forEach(({o, t0, t1})=>{
        const p = at(t0), q = at(t1), osel = sel && sel.kind==='opening' && sel.id===o.id;
        ctx.strokeStyle = osel ? '#1F6FD1' : '#2A261E';
        if(o.type==='window'){
          const off = wallPx*0.35;
          ctx.lineWidth = 1.6;
          [-off, off].forEach(k=>{ ctx.beginPath(); ctx.moveTo(p.x+nrm.x*k, p.y+nrm.y*k); ctx.lineTo(q.x+nrm.x*k, q.y+nrm.y*k); ctx.stroke(); });
          ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
          ctx.fillStyle = osel ? '#1F6FD1' : '#2A261E'; [p,q].forEach(z=>{ ctx.fillRect(z.x-2.5, z.y-2.5, 5, 5); });
        } else {
          const hinge = o.flip ? q : p, other = o.flip ? p : q;
          const sgn = o.side ? -1 : 1;
          const r = sk2V.dist(p,q), leaf = { x: hinge.x + nrm.x*r*sgn, y: hinge.y + nrm.y*r*sgn };
          ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hinge.x, hinge.y); ctx.lineTo(leaf.x, leaf.y); ctx.stroke();
          ctx.lineWidth = 1; ctx.setLineDash([4,3]); ctx.beginPath();
          const a0 = Math.atan2(other.y-hinge.y, other.x-hinge.x), a1 = Math.atan2(leaf.y-hinge.y, leaf.x-hinge.x);
          let da = a1 - a0; while(da > Math.PI) da -= 2*Math.PI; while(da < -Math.PI) da += 2*Math.PI;
          ctx.arc(hinge.x, hinge.y, r, a0, a1, da < 0); ctx.stroke(); ctx.setLineDash([]);
        }
      });
      // length label
      const st = sk2MeasureStatus(sh, i);
      const mid = W2S({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
      const out = cen ? {x:-nrm.x, y:-nrm.y} : {x:-dir.y, y:dir.x};
      const lx = mid.x + out.x*(wallPx/2 + 11), ly = mid.y + out.y*(wallPx/2 + 11);
      let ang = Math.atan2(b.y-a.y, b.x-a.x); if(ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;
      const txt = st==='est' ? sk2Fmt(len, true) : sk2Fmt(len);
