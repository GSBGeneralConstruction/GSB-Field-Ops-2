  if(room){ sk2Select({kind:'room', sid:room.id}); sk2Toast('✓ Your walls connect — room made'); return; }
  S.sel = null; sk2Draw(); sk2Panel();
}
function sk2Push(){ const S = STATE.sk2; S.undo.push(JSON.stringify(S.plan)); if(S.undo.length > 60) S.undo.shift(); }
function sk2Select(h){
  const S = STATE.sk2;
  S.sel = h ? (h.kind==='wall' ? {kind:'wall', sid:h.sid, seg:h.seg} : h) : null;
  if(S.sel && S.sel.kind==='box') S.boxField = S.boxField || 'w';
  sk2Draw(); sk2Panel();
  if(S.sel && (S.sel.kind==='wall' || S.sel.kind==='opening' || S.sel.kind==='box' || S.sel.kind==='column')) sk2FocusTape();
}

/* ---------- a measurement arrived (tape or typed) ---------- */
function sk2TapeCommit(raw){
  const S = STATE.sk2; if(!S || S.readOnly) return;
  const L = sk2ParseLen(raw);
  if(L==null){ sk2Toast('Could not read "'+String(raw).trim()+'"'); return; }
  const sel = S.sel;
  if(!sel){ sk2Toast('Tap a wall first, then measure ('+sk2Fmt(L)+')'); return; }
  sk2ApplyLength(L);
}
function sk2ApplyLength(L){
  const S = STATE.sk2, sel = S.sel, plan = S.plan;
  if(sel.kind==='wall'){
    const sh = plan.shapes.find(x=>x.id===sel.sid); if(!sh) return;
    sk2Push();
    if(!plan.shapes.some(x=>Object.keys(x.meas||{}).length)){
      // very first measurement: this sets the real scale for the whole sketch, so rooms drawn later come out the right size too
      const cur = sk2SegLen(sh, sel.seg);
      if(cur > 1e-6){
        const f = L/cur, o = {x:sh.pts[sel.seg].x, y:sh.pts[sel.seg].y};
        const sc = (p)=>({ x:o.x + (p.x-o.x)*f, y:o.y + (p.y-o.y)*f });
        plan.shapes.forEach(x=>{ x.pts = x.pts.map(sc); });
        plan.openings.forEach(op=>{ op.w = Math.max(18, Math.min(96, op.w*f)); });
        ['boxes','columns','notes'].forEach(k=>plan[k].forEach(it=>{ const q = sc(it); it.x = q.x; it.y = q.y; }));
        const v = S.view, sx = o.x*v.s + v.ox, sy = o.y*v.s + v.oy;
        v.s = v.s/f; v.ox = sx - o.x*v.s; v.oy = sy - o.y*v.s;
      }
    }
    const oldPts = sh.pts.map(q=>({...q}));
    // a new room attached to others grows from the corner it shares with them
    const shared = sh.pts.map((q,k)=> plan.shapes.some(o=>o!==sh && o.pts.some(z=>sk2V.dist(z,q)<0.75)) ? k : -1).filter(k=>k>=0);
    const nseg = sk2SegCount(sh), endB = (sel.seg+1) % sh.pts.length;
    const anchor = shared.includes(sel.seg) ? sel.seg : shared.includes(endB) ? endB : (shared.length ? shared[0] : null);
    const firstEver = !plan.shapes.some(x=>Object.keys(x.meas||{}).length);
    const r = sk2SetLength(plan, sh, sel.seg, L, {anchor, allowScale:firstEver}); S.dirty = true;
    if(!r.ok){ sk2Toast('Could not set that wall'); return; }
    const movedRooms = sk2Propagate(plan, sh, oldPts);
    let msg = '✓ '+sk2Fmt(L);
    if(r.followed!=null) msg += ' — wall '+(r.followed+1)+' updated to '+sk2Fmt(sk2SegLen(sh, r.followed))+' to match';
    if(movedRooms) msg += ' — '+movedRooms+' connected '+(movedRooms===1?'room':'rooms')+' moved to fit';
    if(r.mismatch > 0.5) msg += ' — measurements are off by '+sk2Fmt(r.mismatch)+'; re-check a wall';
    // walk around the room: jump to the next wall that has no measurement yet
    const n = sk2SegCount(sh); let next = null;
    for(let k=1;k<=n;k++){ const j = (sel.seg + k) % n; if(!sh.closed && j===0 && sel.seg===n-1) break; if(sh.meas[j]==null){ next = j; break; } }
    if(next!=null) S.sel = {kind:'wall', sid:sh.id, seg:next}; else msg += ' — all walls measured';
    sk2Toast(msg); sk2Draw(); sk2Panel(); sk2FocusTape(); return;
  }
  if(sel.kind==='opening'){
    const o = plan.openings.find(x=>x.id===sel.id); if(!o) return; sk2Push();
    const sh = plan.shapes.find(x=>x.id===o.sid), len = sk2SegLen(sh, o.seg);
    o.w = Math.min(L, len); const half = (o.w/2)/len; o.t = Math.max(half, Math.min(1-half, o.t));
    S.dirty = true; sk2Toast('✓ '+(o.type==='window'?'Window':'Door')+' width '+sk2Fmt(o.w)); sk2Draw(); sk2Panel(); return;
  }
  if(sel.kind==='box'){
    const b = plan.boxes.find(x=>x.id===sel.id); if(!b) return; sk2Push();
    if(S.boxField==='d'){ b.d = L; S.boxField = 'w'; sk2Toast('✓ Depth '+sk2Fmt(L)); }
    else { b.w = L; S.boxField = 'd'; sk2Toast('✓ Width '+sk2Fmt(L)+' — now measure the depth'); }
    S.dirty = true; sk2Draw(); sk2Panel(); sk2FocusTape(); return;
  }
  if(sel.kind==='column'){ const c = plan.columns.find(x=>x.id===sel.id); if(!c) return; sk2Push(); c.size = L; S.dirty = true; sk2Toast('✓ Column '+sk2Fmt(L)); sk2Draw(); sk2Panel(); return; }
  sk2Toast('Tap a wall first, then measure');
}

function sk2PanelAction(a, btn){
  const S = STATE.sk2, plan = S.plan, sel = S.sel;
  const shOf = ()=> sel && plan.shapes.find(x=>x.id===sel.sid);
  if(a==='setlen'){ const i = document.getElementById(btn.dataset.input||'sk2-len'); const L = sk2ParseLen(i && i.value); if(L==null){ sk2Toast('Type a size like 12\' 4 3/8" or 12 4'); return; } if(i) i.value=''; sk2ApplyLength(L); if(i) i.blur(); return; }
  if(a==='nextwall' || a==='prevwall'){ const sh = shOf(); const n = sk2SegCount(sh); S.sel = {kind:'wall', sid:sh.id, seg:(sel.seg + (a==='nextwall'?1:n-1)) % n}; sk2Draw(); sk2Panel(); sk2FocusTape(); return; }
  if(a==='adddoor' || a==='addwindow'){
    const sh = shOf(); const len = sk2SegLen(sh, sel.seg); const w = Math.min(a==='adddoor'?32:36, len*0.8);
    sk2Push(); const o = { id:sk2Uid(), sid:sh.id, seg:sel.seg, t:0.5, w, type:a==='adddoor'?'door':'window' }; plan.openings.push(o); S.dirty = true;
    sk2Select({kind:'opening', id:o.id}); return;
  }
  if(a==='unmeasure'){ const sh = shOf(); sk2Push(); delete sh.meas[sel.seg]; S.dirty = true; sk2Draw(); sk2Panel(); return; }
  if(a==='delshape'){
    const sh = shOf(); if(!sh || !confirm('Delete '+(sh.closed ? '"'+(sh.name||'Room')+'"' : 'these walls')+'?')) return;
    sk2Push(); plan.shapes = plan.shapes.filter(x=>x.id!==sh.id); plan.openings = plan.openings.filter(o=>o.sid!==sh.id); S.dirty = true; S.sel = null; sk2Draw(); sk2Panel(); return;
  }
  if(a==='measureroom'){ const sh = shOf(); let j = 0; for(let k=0;k<sk2SegCount(sh);k++){ if(!sh.meas || sh.meas[k]==null){ j = k; break; } } S.sel = {kind:'wall', sid:sh.id, seg:j}; sk2Draw(); sk2Panel(); sk2FocusTape(); return; }
  if(a==='openroom'){ S.sel = {kind:'room', sid:btn.dataset.sid}; sk2Draw(); sk2Panel(); return; }
  if(a==='clearpicks'){ S.picks = []; sk2Draw(); sk2Panel(); return; }
  const find = ()=> sel && (sel.kind==='opening' ? plan.openings : sel.kind==='box' ? plan.boxes : sel.kind==='column' ? plan.columns : plan.notes).find(x=>x.id===sel.id);
  const it = find();
  if(a==='delitem'){ if(!it) return; sk2Push(); ['openings','boxes','columns','notes'].forEach(k=>{ plan[k] = plan[k].filter(x=>x.id!==it.id); }); S.dirty = true; S.sel = null; sk2Draw(); sk2Panel(); return; }
  if(!it) return;
  sk2Push(); S.dirty = true;
  if(a==='optype'){ it.type = it.type==='window' ? 'door' : 'window'; }
  if(a==='flip'){ it.flip = !it.flip; }
  if(a==='side'){ it.side = !it.side; }
  if(a==='preset'){ const p = SK2_BOX_PRESETS[+btn.dataset.i]; it.label = p[0]; if(!it.sized){ it.w = p[1]; it.d = p[2]; } it.std = [p[1], p[2]]; S.lastBox = p; S.boxField = 'w'; }
  if(a==='stdsize' && it.std){ it.w = it.std[0]; it.d = it.std[1]; it.sized = false; }
  if(a==='boxsize'){ const w = sk2ParseLen((document.getElementById('sk2-boxw')||{}).value), d = sk2ParseLen((document.getElementById('sk2-boxd')||{}).value); if(w) it.w = w; if(d) it.d = d; it.sized = true; const l = document.getElementById('sk2-boxlabel'); if(l && l.value.trim()) it.label = l.value.trim(); S.lastBox = [it.label, it.w, it.d]; }

  if(a==='dup'){ const c = JSON.parse(JSON.stringify(it)); c.id = sk2Uid(); c.x += 6; c.y += it.d + 6; plan.boxes.push(c); S.sel = {kind:'box', id:c.id}; }

  if(a==='savenote'){ const t = (document.getElementById('sk2-notetext')||{}).value||''; if(t.trim()) it.text = t.trim(); }
  sk2Draw(); sk2Panel();
}
function sk2TopAction(a){

  if(a==='tape'){
    S.tapeOn = !S.tapeOn; try{ localStorage.setItem('gsb2-sk2-tape', S.tapeOn?'1':'0'); }catch(e){}
    const b = document.querySelector('#sk2-root [data-sk2="tape"]'); if(b){ b.classList.toggle('on', S.tapeOn); b.textContent = '📏 Tape '+(S.tapeOn?'ON':'OFF'); }
    sk2Toast(S.tapeOn ? 'Tape ON — pair the T1R in keyboard mode, tap a wall, press the save button on the tape' : 'Tape OFF — type sizes in the panel'); sk2Panel(); if(S.tapeOn) sk2FocusTape(); return;
  }

  if(a==='cancel'){ if(S.dirty && !confirm('Close without saving? Your changes to this sketch will be lost.')) return; sk2Close(); return; }

}
/* picture of the whole plan for previews, the worksheet and printouts */
function sk2Snapshot(plan){
  const S = STATE.sk2;
  const b = sk2Bounds(plan);
  const W = 1400, H = 1000, pad = 70;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H + 46;
  let view = { s:2, ox:W/2, oy:H/2 };
  if(b){ const bw = Math.max(48, b.maxx-b.minx), bh = Math.max(48, b.maxy-b.miny); const s = Math.min((W-2*pad)/bw, (H-2*pad)/bh, 10); view = { s, ox: W/2 - (b.minx+bw/2)*s, oy: H/2 - (b.miny+bh/2)*s }; }
  const keepSel = S.sel, keepPicks = S.picks, keepStroke = S.stroke; S.sel = null; S.picks = []; S.stroke = null;
  sk2Draw({ canvas:cv, view });
  S.sel = keepSel; S.picks = keepPicks; S.stroke = keepStroke;
  const ctx = cv.getContext('2d'); const t = sk2Totals(plan);

    for(const nb of neighbors){
      if(nb.edgeId===edge.id) continue;
      if(pathEdgeIds.includes(nb.edgeId)) continue;
      if(visited.has(nb.toKey) && nb.toKey!==endKey) continue;
      visited.add(nb.toKey);
      queue.push([nb.toKey, [...pathKeys, nb.toKey], [...pathEdgeIds, nb.edgeId]]);
    }
  }
  return null;
}
function detectRooms(){
  const s = STATE.sketchEditor;
  const lines = s.strokes.filter(st=>st.type==='line');
  const { adjacency, edges } = buildLineGraph(lines);
  const foundByKey = {};
  edges.forEach(edge=>{
    const cycle = findShortestCycleForEdge(edge, adjacency);
    if(cycle && cycle.nodeKeys.length>=3){
      const key = [...new Set(cycle.nodeKeys)].sort().join(',');
      if(!foundByKey[key]) foundByKey[key] = cycle;
    }
  });
  const newRooms = [];
  Object.values(foundByKey).forEach(cycle=>{
    const key = [...new Set(cycle.nodeKeys)].sort().join(',');
    const existing = (s.rooms||[]).find(r => [...new Set(r.nodeKeys)].sort().join(',') === key);
    newRooms.push({ id: existing?existing.id:uid(), nodeKeys: cycle.nodeKeys, name: existing?existing.name:'', color: existing?existing.color:null });
  });
  s.rooms = newRooms;
}
function chainLinesToPolygon(lineIds, strokes){
  const lines = lineIds.map(id=>strokes.find(st=>st.id===id)).filter(Boolean);
  if(lines.length<3) return null;
  const used = new Set([lines[0].id]);
  const path = [nodeKeyStr(lines[0].x1,lines[0].y1), nodeKeyStr(lines[0].x2,lines[0].y2)];
  let safety = 0;
  while(used.size < lines.length && safety++ < lines.length+2){
    const lastKey = path[path.length-1];
    const next = lines.find(l=> !used.has(l.id) && (nodeKeyStr(l.x1,l.y1)===lastKey || nodeKeyStr(l.x2,l.y2)===lastKey));
    if(!next) return null;
    used.add(next.id);
    path.push(nodeKeyStr(next.x1,next.y1)===lastKey ? nodeKeyStr(next.x2,next.y2) : nodeKeyStr(next.x1,next.y1));
  }
  if(path[0] !== path[path.length-1]) return null;
  path.pop();
  return path;
}
function polygonAreaLogical(points){
  let area = 0;
  for(let i=0;i<points.length;i++){
    const p1 = points[i], p2 = points[(i+1)%points.length];
    area += p1.x*p2.y - p2.x*p1.y;
  }
  return Math.abs(area)/2;
}
function pointInPolygon(x, y, points){
  let inside = false;
  for(let i=0, j=points.length-1; i<points.length; j=i++){
    const xi=points[i].x, yi=points[i].y, xj=points[j].x, yj=points[j].y;
    const intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function polygonPerimeterLogical(points){
  let sum = 0;
  for(let i=0;i<points.length;i++){
    const p1 = points[i], p2 = points[(i+1)%points.length];
    sum += Math.hypot(p2.x-p1.x, p2.y-p1.y);
  }

}

function closestPointOnSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq===0?0:((px-x1)*dx+(py-y1)*dy)/lenSq;
  t = Math.max(0,Math.min(1,t));
  return { x: x1+t*dx, y: y1+t*dy };
}

function findLineBetweenPoints(p1, p2, lines){
  const near = (a,b)=> Math.abs(a.x-b.x) < 0.75 && Math.abs(a.y-b.y) < 0.75;
  return lines.find(l=>{
    const a = {x:l.x1,y:l.y1}, b = {x:l.x2,y:l.y2};
    return (near(a,p1)&&near(b,p2)) || (near(a,p2)&&near(b,p1));
  });
}
// Real-world perimeter & area of a room from the numbers typed on its walls (not from how big it was drawn)
function polygonRealStats(nodeKeys){
  const s = STATE.sketchEditor;
  const pts = (nodeKeys||[]).map(nodeKeyToPoint);
  const n = pts.length;
  if(n < 3) return { perimIn:null, areaSqIn:null };
  const lines = s.strokes.filter(st=>st.type==='line');
  let perimReal = 0, perimPx = 0, allStated = true, missing = false;
  const sides = [];
  for(let i=0;i<n;i++){
    const a = pts[i], b = pts[(i+1)%n];
    const px = Math.hypot(b.x-a.x, b.y-a.y);
    perimPx += px;
    const ln = findLineBetweenPoints(a, b, lines);
    let r = null;
    if(ln && ln.manualLength > 0) r = ln.manualLength;
    else { allStated = false; if(s.calibScale) r = px * s.calibScale; }
    sides.push(r);
    if(r == null) missing = true; else perimReal += r;
  }
  if(missing) return { perimIn:null, areaSqIn:null };
  let areaSqIn = null;
  let isRect = false;
  if(n === 4 && allStated){
    isRect = true;
    for(let i=0;i<4 && isRect;i++){
      const a = pts[i], b = pts[(i+1)%4], c = pts[(i+2)%4];
      const v1x=b.x-a.x, v1y=b.y-a.y, v2x=c.x-b.x, v2y=c.y-b.y;
      const cos = (v1x*v2x+v1y*v2y)/((Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1);
      if(Math.abs(cos) > 0.2) isRect = false;
    }
  }
  if(isRect) areaSqIn = ((sides[0]+sides[2])/2) * ((sides[1]+sides[3])/2);
  else if(perimPx > 0){ const k = perimReal / perimPx; areaSqIn = polygonAreaLogical(pts) * k * k; }
  return { perimIn: perimReal, areaSqIn };
}
function wholeHouseTotals(){
  const s = STATE.sketchEditor;
  const u = SKETCH_UNITS[s.unit] || SKETCH_UNITS.ft;
  let sq = 0, any = false;
  (s.rooms||[]).forEach(r=>{ const st = polygonRealStats(r.nodeKeys); if(st.areaSqIn != null){ sq += st.areaSqIn; any = true; } });
  let wall = 0; s.strokes.filter(st=>st.type==='line').forEach(l=>{ const r = lineRealInches(l, s); if(r != null) wall += r; });
  return {
    areaText: any ? (sq/(u.toInches**2)).toFixed(1)+' sq '+u.label : '—',
    wallText: wall > 0 ? (wall/u.toInches).toFixed(1)+' '+u.label : '—',
  };
}
function computeSelectionMeasurements(){
  const s = STATE.sketchEditor;

  const sel = [...s.selectedIds].map(id=>s.strokes.find(st=>st.id===id)).filter(st=>st && st.type==='line');
  let linearText = 'Select walls to measure';
  if(sel.length > 0){
    let total = 0, missing = false;
    sel.forEach(l=>{ const r = lineRealInches(l, s); if(r == null) missing = true; else total += r; });
    linearText = total === 0 ? 'Type in the wall measurements first' : (total/u.toInches).toFixed(1)+' '+u.label+' linear'+(missing ? ' (some walls have no number)' : '');
  }

    const chain = chainLinesToPolygon(sel.map(l=>l.id), s.strokes);
    if(chain){ const st = polygonRealStats(chain); if(st.areaSqIn != null) areaText = (st.areaSqIn/(u.toInches**2)).toFixed(1)+' sq '+u.label; }
  }
  return { linearText, areaText };
}

function findAnyStrokeNear(x,y){

function normalizeRect(x1,y1,x2,y2){ return { x1:Math.min(x1,x2), y1:Math.min(y1,y2), x2:Math.max(x1,x2), y2:Math.max(y1,y2) }; }
function rectContainsPoint(rect, x, y){ return x>=rect.x1 && x<=rect.x2 && y>=rect.y1 && y<=rect.y2; }
function strokeIntersectsRect(st, rect){
  if(st.type==='line'){
    const mx=(st.x1+st.x2)/2, my=(st.y1+st.y2)/2;
    return rectContainsPoint(rect, st.x1, st.y1) || rectContainsPoint(rect, st.x2, st.y2) || rectContainsPoint(rect, mx, my);
  }
  if(st.type==='text') return rectContainsPoint(rect, st.x, st.y);
  if(st.type==='door') return rectContainsPoint(rect, st.x, st.y);
  if(st.type==='window') return rectContainsPoint(rect, st.x, st.y);
  if(st.type==='free') return st.points.some(p=>rectContainsPoint(rect, p.x, p.y));
  if(st.type==='dim') return rectContainsPoint(rect, (st.x1+st.x2)/2, (st.y1+st.y2)/2);
  if(st.type==='box') return rectContainsPoint(rect, st.x+st.w/2, st.y+st.h/2);
  if(st.type==='column') return rectContainsPoint(rect, st.x, st.y);
  return false;
}
function initSketchCanvas(){

function drawSketch(ctx, s){
  ctx.clearRect(0,0,SKETCH_LOGICAL_W, SKETCH_LOGICAL_H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,SKETCH_LOGICAL_W, SKETCH_LOGICAL_H);
  ctx.strokeStyle = '#E4DFD0'; ctx.lineWidth = 1;
  for(let x=0; x<=SKETCH_LOGICAL_W; x+=SKETCH_GRID_SIZE){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,SKETCH_LOGICAL_H); ctx.stroke(); }
  for(let y=0; y<=SKETCH_LOGICAL_H; y+=SKETCH_GRID_SIZE){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(SKETCH_LOGICAL_W,y); ctx.stroke(); }
  (s.rooms||[]).forEach(room=>{
    const points = (room.nodeKeys||[]).map(nodeKeyToPoint);
    if(points.length<3) return;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = room.color || s.roomColor || '#2E5C8A';
    ctx.beginPath();
    points.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath(); ctx.fill();

function sketchPointerMove(e, canvas){

  const pos = sketchPointerPos(e, canvas);
  if(sketchDragState.type==='line'){
    const magnetHit = s.magnetOn ? findNearestEndpoint(pos.x, pos.y, 20) : null;
    const endPoint = magnetHit ? magnetHit : snapAngle(sketchDragState.startX, sketchDragState.startY, pos.x, pos.y);
    sketchDragState.preview = { x1: sketchDragState.startX, y1: sketchDragState.startY, x2: endPoint.x, y2: endPoint.y };

    sketchDragState.target.x = sketchDragState.origX + (pos.x - sketchDragState.rawStartX);
    sketchDragState.target.y = sketchDragState.origY + (pos.y - sketchDragState.rawStartY);

    return; // no visual feedback needed until we know it's a real tap vs a drag

    applyTranslationFromSnapshot(sketchDragState.snap, pos.x-sketchDragState.rawStartX, pos.y-sketchDragState.rawStartY);
  } else if(sketchDragState.type==='resize-line'){
    resizeLineTo(sketchDragState, pos.x, pos.y);
  } else if(sketchDragState.type==='resize-box'){
    resizeBoxTo(sketchDragState, pos.x, pos.y);
  } else if(sketchDragState.type==='box'){
    sketchDragState.preview = normalizeRect(sketchDragState.startX, sketchDragState.startY, snap10(pos.x), snap10(pos.y));
  } else if(sketchDragState.type==='move-item'){
    sketchDragState.target.x = sketchDragState.origX + (pos.x - sketchDragState.rawStartX);
    sketchDragState.target.y = sketchDragState.origY + (pos.y - sketchDragState.rawStartY);

    const a = fromP1 ? 0 : L-len, b = a+len;

/* ---- copy / paste / move / rotate selected items; box resize handles ---- */
function boxLocalPoint(st, x, y){
  const a = st.angle || 0, cx = st.x+st.w/2, cy = st.y+st.h/2, c = Math.cos(-a), sn = Math.sin(-a);
  return { x: (x-cx)*c - (y-cy)*sn, y: (x-cx)*sn + (y-cy)*c };
}
function pointInBox(st, x, y, pad){
  const p = boxLocalPoint(st, x, y);
  return Math.abs(p.x) <= st.w/2 + pad && Math.abs(p.y) <= st.h/2 + pad;
}
function boxCorners(st){
  const a = st.angle || 0, cx = st.x+st.w/2, cy = st.y+st.h/2, c = Math.cos(a), sn = Math.sin(a);
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{
    const lx = sx*st.w/2, ly = sy*st.h/2;
    return { sx, sy, x: cx + lx*c - ly*sn, y: cy + lx*sn + ly*c };
  });
}
function selectedSingleLine(){ const s = STATE.sketchEditor; if(!s || s.mode!=='select' || s.readOnly || s.selectedIds.size!==1) return null; const st = s.strokes.find(x=>s.selectedIds.has(x.id)); return (st && st.type==='line') ? st : null; }
function findLineHandle(x, y){
  const ln = selectedSingleLine(); if(!ln) return null;
  if(Math.hypot(ln.x1-x, ln.y1-y) < 18) return { line: ln, end: 1 };
  if(Math.hypot(ln.x2-x, ln.y2-y) < 18) return { line: ln, end: 2 };
  return null;
}
function drawLineHandles(ctx){
  const ln = selectedSingleLine(); if(!ln) return;
  [[ln.x1,ln.y1],[ln.x2,ln.y2]].forEach(([px,py])=>{
    ctx.save(); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2E5C8A'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
  });
}
function startLineResize(h){
  const s = STATE.sketchEditor; const ln = h.line;
  const px = h.end===1 ? ln.x1 : ln.x2, py = h.end===1 ? ln.y1 : ln.y2;
  const linked = [];
  if(s.linkCorners !== false){
    s.strokes.forEach(o=>{
      if(o===ln || o.type!=='line') return;
      if(Math.hypot(o.x1-px, o.y1-py) < 3) linked.push({line:o, end:1});
      if(Math.hypot(o.x2-px, o.y2-py) < 3) linked.push({line:o, end:2});
    });
  }
  return { type:'resize-line', target:ln, end:h.end, linked, downTime:Date.now() };
}
function resizeLineTo(d, px, py){
  const s = STATE.sketchEditor;
  let nx, ny;
  const mg = s.magnetOn ? findNearestEndpoint(px, py, 14, [d.target].concat(d.linked.map(l=>l.line))) : null;
  if(mg){ nx = mg.x; ny = mg.y; } else { nx = snap10(px); ny = snap10(py); }
  const set = (l, end)=>{ if(end===1){ l.x1 = nx; l.y1 = ny; } else { l.x2 = nx; l.y2 = ny; } };
  set(d.target, d.end); d.linked.forEach(l=>set(l.line, l.end));
}
function findBoxHandle(x, y){
  const s = STATE.sketchEditor;
  for(let i=s.strokes.length-1; i>=0; i--){
    const st = s.strokes[i];
    if(st.type !== 'box') continue;
    for(const c of boxCorners(st)){ if(Math.hypot(c.x-x, c.y-y) < 14) return { box: st, sx: c.sx, sy: c.sy }; }
  }
  return null;
}
function drawBoxHandles(ctx, s){
  s.strokes.forEach(st=>{
    if(st.type !== 'box') return;
    boxCorners(st).forEach(c=>{
      ctx.save(); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#7A6A45'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(c.x-5, c.y-5, 10, 10); ctx.fill(); ctx.stroke(); ctx.restore();
    });
  });
}
function resizeBoxTo(drag, px, py){
  const b = drag.target;
  const p = boxLocalPoint(b, px, py);
  const ox = -drag.sx * b.w/2, oy = -drag.sy * b.h/2;      // the opposite corner stays where it is
  let nw = Math.max(14, Math.round(Math.abs(p.x-ox)/5)*5), nh = Math.max(14, Math.round(Math.abs(p.y-oy)/5)*5);
  const lcx = ox + drag.sx*nw/2, lcy = oy + drag.sy*nh/2;  // new center in the box's own axes
  const a = b.angle || 0, c = Math.cos(a), sn = Math.sin(a);
  const cx = b.x+b.w/2, cy = b.y+b.h/2;
  const wx = cx + lcx*c - lcy*sn, wy = cy + lcx*sn + lcy*c;
  b.w = nw; b.h = nh; b.x = wx - nw/2; b.y = wy - nh/2;
}
function selectedStrokes(){ const s = STATE.sketchEditor; return s.strokes.filter(st=>s.selectedIds.has(st.id)); }
function strokeAnchorPoints(st){
  if(st.type==='line' || st.type==='dim') return [{x:st.x1,y:st.y1},{x:st.x2,y:st.y2}];
  if(st.type==='free') return st.points;
  if(st.type==='box') return boxCorners(st);
  return [{x:st.x,y:st.y}];
}
function translateStroke(st, dx, dy){
  if(st.type==='line' || st.type==='dim'){ st.x1+=dx; st.y1+=dy; st.x2+=dx; st.y2+=dy; }
  else if(st.type==='free'){ st.points = st.points.map(p=>({x:p.x+dx,y:p.y+dy})); }
  else { st.x += dx; st.y += dy; }
}
function rotateSelection(deg){
  const s = STATE.sketchEditor;
  const sel = selectedStrokes();
  if(!sel.length){ alert('Select something first (drag across it, or tap it).'); return; }
  const pts = sel.flatMap(strokeAnchorPoints);
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
  const th = deg*Math.PI/180, c = Math.cos(th), sn = Math.sin(th);
  const r2 = v=>Math.round(v*100)/100;
  const rp = (x,y)=>({ x: r2(cx + (x-cx)*c - (y-cy)*sn), y: r2(cy + (x-cx)*sn + (y-cy)*c) });
  sel.forEach(st=>{
    if(st.type==='line' || st.type==='dim'){ const a = rp(st.x1,st.y1), b = rp(st.x2,st.y2); st.x1=a.x; st.y1=a.y; st.x2=b.x; st.y2=b.y; }
    else if(st.type==='free'){ st.points = st.points.map(p=>rp(p.x,p.y)); }
    else if(st.type==='box'){ const q = rp(st.x+st.w/2, st.y+st.h/2); st.x = q.x-st.w/2; st.y = q.y-st.h/2; st.angle = (st.angle||0)+th; }
    else if(st.type==='door' || st.type==='window'){ const q = rp(st.x,st.y); st.x=q.x; st.y=q.y; st.angle = (st.angle||0)+th; }
    else { const q = rp(st.x,st.y); st.x=q.x; st.y=q.y; }
  });
  detectRooms(); renderSketchOverlay();
}
function copySelection(silent){
  const sel = selectedStrokes();
  if(!sel.length){ alert('Select something first (drag across it, or tap it), then copy.'); return false; }
  STATE.sketchClipboard = { items: JSON.parse(JSON.stringify(sel)), pastes: 0 };
  if(!silent) showToast('Copied '+sel.length+' item'+(sel.length===1?'':'s')+'. Tap Paste to place it.');
  return true;
}
function pasteSelection(){
  const s = STATE.sketchEditor;
  const cb = STATE.sketchClipboard;
  if(!cb || !cb.items.length){ alert('Nothing copied yet. Select something and tap Copy first.'); return; }
  cb.pastes++;
  const off = 40*cb.pastes;
  const added = [];
  cb.items.forEach(it=>{
    const n = JSON.parse(JSON.stringify(it));
    n.id = uid();
    if(Array.isArray(n.extra)) n.extra.forEach(m=>{ m.id = uid(); });
    translateStroke(n, off, off);
    s.strokes.push(n); added.push(n.id);
  });
  s.mode = 'select';
  s.selectedIds = new Set(added);
  detectRooms(); renderSketchOverlay();
  showToast('Pasted. Drag it where you want it, and use the rotate buttons to turn it.');
}
function snapshotSelectionPositions(){
  return selectedStrokes().map(st=>({ id: st.id, copy: JSON.parse(JSON.stringify(st)) }));
}
function applyTranslationFromSnapshot(snap, dx, dy){
  const s = STATE.sketchEditor;
  snap.forEach(o=>{
    const live = s.strokes.find(x=>x.id===o.id); if(!live) return;
    const base = JSON.parse(JSON.stringify(o.copy));
    translateStroke(base, dx, dy);
    Object.keys(base).forEach(k=>{ live[k] = base[k]; });
  });
}

/* ---- Measure Gap: tap the open space between two walls and type the distance between them ---- */
function castRay(px, py, dx, dy){
  const s = STATE.sketchEditor;
  let best = null;
  s.strokes.forEach(l=>{
    if(l.type !== 'line') return;
    const ex = l.x2-l.x1, ey = l.y2-l.y1;
    const den = dx*ey - dy*ex;
    if(Math.abs(den) < 1e-9) return;
    const t = ((l.x1-px)*ey - (l.y1-py)*ex) / den;
    const u = ((l.x1-px)*dy - (l.y1-py)*dx) / den;
    if(t > 0.5 && u >= 0 && u <= 1 && (!best || t < best.t)) best = { t, line:l, x:px+dx*t, y:py+dy*t };
  });
  return best;
}

/* Tap ON a wall: measure the stretch of that wall between the walls that touch it (or its ends) */
function createSpanDimAt(x, y){
  const s = STATE.sketchEditor;
  let W = null, wd = 1e9;
  s.strokes.forEach(l=>{ if(l.type!=='line') return; const d = pointToSegmentDist(x,y,l.x1,l.y1,l.x2,l.y2); if(d<wd){ wd=d; W=l; } });
  if(!W || wd > 14) return false;
  const ex = W.x2-W.x1, ey = W.y2-W.y1, L = Math.hypot(ex,ey); if(L < 8) return false;
  const dx = ex/L, dy = ey/L, nx = -dy, ny = dx;
  const half = (l)=> (isWall(l) ? WALL_THICK : THIN_THICK) / 2;
  const tOf = (px,py)=> (px-W.x1)*dx + (py-W.y1)*dy;
  const offOf = (px,py)=> (px-W.x1)*nx + (py-W.y1)*ny;
  const tapT = Math.max(0, Math.min(L, tOf(x,y)));
  let bps = [ {t:0, h:0}, {t:L, h:0} ];
  let side = 0;
  s.strokes.forEach(l=>{
    if(l===W || l.type!=='line') return;
    const pts = [[l.x1,l.y1],[l.x2,l.y2]];
    let hit = false;
    pts.forEach(([px,py],i)=>{
      const o = offOf(px,py), t = tOf(px,py);
      if(Math.abs(o) <= 12 && t >= -12 && t <= L+12){
        hit = true; bps.push({t:Math.max(0,Math.min(L,t)), h:half(l)});
        const far = i===0 ? pts[1] : pts[0]; const fo = offOf(far[0],far[1]);
        if(Math.abs(fo) > 12 && side === 0) side = fo > 0 ? 1 : -1;
      }
    });
    if(!hit){   // a wall crossing straight through
      const o1 = offOf(l.x1,l.y1), o2 = offOf(l.x2,l.y2);
      if(o1*o2 < 0){ const f = o1/(o1-o2); const px = l.x1+(l.x2-l.x1)*f, py = l.y1+(l.y2-l.y1)*f, t = tOf(px,py); if(t>0 && t<L) bps.push({t, h:half(l)}); }
    }
  });
  bps.sort((a,b)=>a.t-b.t);
  const m = [];
  bps.forEach(b=>{ const last = m[m.length-1]; if(last && b.t - last.t < 6){ last.h = Math.max(last.h,b.h); last.t = (last.t+b.t)/2; } else m.push({t:b.t, h:b.h}); });
  let i = 0; while(i < m.length-2 && m[i+1].t < tapT) i++;
  const a = m[i], b = m[i+1];
  const t1 = a.t + a.h, t2 = b.t - b.h;
  if(t2 - t1 < 4) return false;
  if(side === 0){   // default: toward the middle of the drawing
    let cx=0, cy=0, n=0; s.strokes.forEach(l=>{ if(l.type==='line'){ cx+=l.x1+l.x2; cy+=l.y1+l.y2; n+=2; } });
    if(n){ side = offOf(cx/n, cy/n) >= 0 ? 1 : -1; } else side = 1;
  }
  const off = side * (half(W) + 12);
  const dim = { id: uid(), type:'dim', x1:W.x1+dx*t1+nx*off, y1:W.y1+dy*t1+ny*off, x2:W.x1+dx*t2+nx*off, y2:W.y1+dy*t2+ny*off, inches:null, label:'', color:'#2E5C8A', span:true };
  s.strokes.push(dim);
  redrawSketchCanvas();
  showDimPopup(dim, true);
  return true;
}
function nearestWallTo(x, y, maxD){
  const s = STATE.sketchEditor; let W = null, wd = 1e9;
  s.strokes.forEach(l=>{ if(l.type!=='line') return; const d = pointToSegmentDist(x,y,l.x1,l.y1,l.x2,l.y2); if(d<wd){ wd=d; W=l; } });
  return (W && wd <= maxD) ? W : null;
}
function dimBetweenWalls(A, B){
  const half = (l)=> (isWall(l) ? WALL_THICK : THIN_THICK) / 2;
  const ax = A.x2-A.x1, ay = A.y2-A.y1, aL = Math.hypot(ax,ay)||1, dx = ax/aL, dy = ay/aL, nx = -dy, ny = dx;
  const bx = B.x2-B.x1, by = B.y2-B.y1, bL = Math.hypot(bx,by)||1;
  let P = null, Q = null;
  if(Math.abs((ax*by - ay*bx)/(aL*bL)) < 0.12){      // parallel walls: straight across, in the middle of where they face each other
    const tA1 = 0, tA2 = aL, tB1 = (B.x1-A.x1)*dx+(B.y1-A.y1)*dy, tB2 = (B.x2-A.x1)*dx+(B.y2-A.y1)*dy;
    const lo = Math.max(Math.min(tA1,tA2), Math.min(tB1,tB2)), hi = Math.min(Math.max(tA1,tA2), Math.max(tB1,tB2));
    if(hi - lo > 4){
      const t = (lo+hi)/2, o = ((B.x1+B.x2)/2-A.x1)*nx + ((B.y1+B.y2)/2-A.y1)*ny;
      P = { x:A.x1+dx*t, y:A.y1+dy*t }; Q = { x:P.x+nx*o, y:P.y+ny*o };
    }
  }
  if(!P){                                              // otherwise: the shortest distance between the two walls
    let best = 1e9;
    const tryPt = (px,py,L)=>{ const t = Math.max(0,Math.min(1, ((px-L.x1)*(L.x2-L.x1)+(py-L.y1)*(L.y2-L.y1))/(((L.x2-L.x1)**2+(L.y2-L.y1)**2)||1)));
      return { x:L.x1+(L.x2-L.x1)*t, y:L.y1+(L.y2-L.y1)*t }; };
    [[A.x1,A.y1],[A.x2,A.y2]].forEach(([px,py])=>{ const q = tryPt(px,py,B), d = Math.hypot(q.x-px,q.y-py); if(d<best){ best=d; P={x:px,y:py}; Q=q; } });
    [[B.x1,B.y1],[B.x2,B.y2]].forEach(([px,py])=>{ const q = tryPt(px,py,A), d = Math.hypot(q.x-px,q.y-py); if(d<best){ best=d; P=q; Q={x:px,y:py}; } });
  }
  const L = Math.hypot(Q.x-P.x, Q.y-P.y); if(L < 1) return null;
  const ux = (Q.x-P.x)/L, uy = (Q.y-P.y)/L, ha = half(A), hb = half(B);
  if(L - ha - hb < 3) return null;
  return { x1:P.x+ux*ha, y1:P.y+uy*ha, x2:Q.x-ux*hb, y2:Q.y-uy*hb };
}
function createDimAt(x, y){
  const s = STATE.sketchEditor;
  const W = nearestWallTo(x, y, 16);
  if(!W){ s.measureFirst = null; redrawSketchCanvas(); showToast('Tap a wall to start — then tap the wall you want to measure to.'); return; }
  if(!s.measureFirst){ s.measureFirst = W.id; redrawSketchCanvas(); showToast('Now tap the other wall. (Tap the same wall again to measure along it.)'); return; }
  const first = s.strokes.find(st=>st.id===s.measureFirst);
  if(!first){ s.measureFirst = W.id; redrawSketchCanvas(); return; }
  s.measureFirst = null;
  if(first.id === W.id){ redrawSketchCanvas(); if(!createSpanDimAt(x, y)) showToast('Nothing to measure along that wall.'); return; }
  const g = dimBetweenWalls(first, W);
  if(!g){ redrawSketchCanvas(); showToast('Those two walls touch or cross — nothing to measure between them.'); return; }
  const dim = { id: uid(), type:'dim', x1:g.x1, y1:g.y1, x2:g.x2, y2:g.y2, inches:null, label:'', color:'#2E5C8A' };
  s.strokes.push(dim);
  redrawSketchCanvas();
  showDimPopup(dim, true);
}
function findDimNear(x, y){
  const s = STATE.sketchEditor;
  for(let i=s.strokes.length-1; i>=0; i--){
    const st = s.strokes[i];
    if(st.type==='dim' && pointToSegmentDist(x,y,st.x1,st.y1,st.x2,st.y2) < 12) return st;
  }
  return null;
}
function drawDim(ctx, st, s){
  const L = Math.hypot(st.x2-st.x1, st.y2-st.y1); if(L < 1) return;
  const dx = (st.x2-st.x1)/L, dy = (st.y2-st.y1)/L, nx = -dy, ny = dx;
  ctx.save();
  ctx.strokeStyle = st.color; ctx.lineWidth = 1.6; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke();
  [[st.x1,st.y1],[st.x2,st.y2]].forEach(([px,py])=>{ ctx.beginPath(); ctx.moveTo(px-nx*6, py-ny*6); ctx.lineTo(px+nx*6, py+ny*6); ctx.stroke(); });
  if(s.showMeasurements || st.inches == null){
    const text = (st.label ? st.label+' ' : '') + (st.inches != null ? unitFmt(st.inches, s) : '?');
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width, mx = (st.x1+st.x2)/2, my = (st.y1+st.y2)/2;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fillRect(mx-w/2-3, my-8, w+6, 16);
    ctx.fillStyle = st.color; ctx.fillText(text, mx, my);
  }
  ctx.restore();
}
function showDimPopup(dim, isNew){
  const s = STATE.sketchEditor;
  const cur = dim.inches != null ? unitNum(dim.inches, s) : '';
  const sh = sketchPopupShell(`
    ${SK_TITLE(isNew ? 'Add measurement' : 'Measurement')}
    ${SK_LBL('Distance')}
    <div style="display:flex;gap:6px;"><input id="dm-val" type="text" inputmode="decimal" value="${esc(cur)}" placeholder="e.g. 10" style="${SK_INPUT}flex:1;min-width:0;"><select id="dm-unit" style="${SK_INPUT}padding:8px 4px;">${SK_UNITS_OPTS(s.unit)}</select></div>
    <input id="dm-label" type="text" value="${esc(dim.label||'')}" placeholder="Name (optional) e.g. to counter" style="${SK_INPUT}width:100%;margin-top:8px;">
    <div class="subtle" style="font-size:11px;margin-top:4px;">Just a label — nothing moves or resizes.</div>
    <div style="display:flex;justify-content:space-between;gap:6px;margin-top:14px;">
      ${isNew ? '<span></span>' : '<button type="button" id="dm-delete" class="btn ghost small" style="color:var(--warn);">Delete</button>'}
      <div style="display:flex;gap:6px;"><button type="button" id="dm-cancel" class="btn ghost small">${isNew?'Cancel':'Close'}</button><button type="button" id="dm-save" class="btn small">Save</button></div>
    </div>`);
  const $ = id => sh.pop.querySelector('#'+id);
  const input = $('dm-val'); focusWithKeyboard(input);
  $('dm-cancel').addEventListener('click', ()=>{ if(isNew) s.strokes = s.strokes.filter(x=>x.id!==dim.id); sh.close(); renderSketchOverlay(); });
  if($('dm-delete')) $('dm-delete').addEventListener('click', ()=>{ s.strokes = s.strokes.filter(x=>x.id!==dim.id); sh.close(); renderSketchOverlay(); });
  $('dm-save').addEventListener('click', ()=>{
    const v = input.value.trim();
    const u = SKETCH_UNITS[$('dm-unit').value] || SKETCH_UNITS.ft;
    if(v !== ''){ const n = parseFloat(v); if(isNaN(n) || n <= 0){ alert('Please enter a positive number.'); return; } dim.inches = n*u.toInches; } else dim.inches = null;
    s.unit = $('dm-unit').value; dim.label = $('dm-label').value.trim();
    sh.close(); renderSketchOverlay();
  });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') $('dm-save').click(); });
}

function attachSketchToolbarHandlers(){
  document.querySelectorAll('[data-sketch-action]').forEach(el=>{
    const isPicker = el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type==='color');
    const eventName = isPicker ? 'change' : 'click';
    el.addEventListener(eventName, ()=>{
      const action = el.dataset.sketchAction;
      const s = STATE.sketchEditor;
      if(action==='mode-line'){ s.mode='line'; renderSketchOverlay(); }
      if(action==='mode-wall'){ s.mode='wall'; renderSketchOverlay(); }
      if(action==='mode-box'){ s.mode='box'; renderSketchOverlay(); }
      if(action==='mode-measure'){ s.mode='measure'; s.measureFirst=null; renderSketchOverlay(); }
      if(action==='mode-column'){ s.mode='column'; renderSketchOverlay(); }
      if(action==='mode-free'){ s.mode='free'; renderSketchOverlay(); }
      if(action==='mode-text'){ s.mode='text'; renderSketchOverlay(); }
      if(action==='mode-door'){ s.mode='door'; renderSketchOverlay(); }
      if(action==='mode-window'){ s.mode='window'; renderSketchOverlay(); }
      if(action==='mode-select'){ s.mode='select'; renderSketchOverlay(); }
      if(action==='mode-edit'){ s.mode='edit'; renderSketchOverlay(); }
      if(action==='delete-selected'){
        if(s.selectedIds.size>0){
          s.strokes = s.strokes.filter(st=>!s.selectedIds.has(st.id));
          s.selectedIds.clear();
          detectRooms();
          renderSketchOverlay();
        }
      }
      if(action==='clear-selection'){ s.selectedIds.clear(); renderSketchOverlay(); }
      if(action==='copy-sel'){ copySelection(false); renderSketchOverlay(); }
      if(action==='paste-sel'){ pasteSelection(); }
      if(action==='dup-sel'){ if(copySelection(true)) pasteSelection(); }
      if(action==='rot-left'){ rotateSelection(-15); }
      if(action==='rot-right'){ rotateSelection(15); }
      if(action==='rot-90'){ rotateSelection(90); }
      if(action==='rot-custom'){ const v = prompt('Rotate by how many degrees? (positive turns right, negative turns left)', '45'); const n = parseFloat(v); if(!isNaN(n)) rotateSelection(n); }
      if(action==='name-room'){
        const lineIds = [...s.selectedIds].filter(id => { const st=s.strokes.find(x=>x.id===id); return st && st.type==='line'; });
        if(lineIds.length<3){ alert('Select at least 3 connected walls to name a room.'); return; }
        const name = prompt('Name this room:', '');
        if(!name) return;
        const chain = chainLinesToPolygon(lineIds, s.strokes);
        if(!chain){ alert("Those walls don't form a closed loop, so I can't calculate its area — but you can still name it; area just won't show."); }
        const key = chain ? [...new Set(chain)].sort().join(',') : null;
        let room = key ? s.rooms.find(r=>[...new Set(r.nodeKeys)].sort().join(',')===key) : null;
        if(!room){
          room = { id: uid(), nodeKeys: chain || [], name: '', color: null };
          s.rooms.push(room);
        }
        room.name = name;
        renderSketchOverlay();
      }
      if(action==='set-color'){ s.color = el.dataset.color; renderSketchOverlay(); }
      if(action==='set-room-color'){ s.roomColor = el.value; renderSketchOverlay(); }
      if(action==='toggle-measurements'){ s.showMeasurements = !s.showMeasurements; renderSketchOverlay(); }
      if(action==='fill-remaining-measurements'){
        if(s.calibScale==null){ alert('Type in at least one wall measurement first (tap a wall) — the others get estimated from it.'); return; }
        let filled = 0;
        s.strokes.forEach(st=>{
          if(st.type==='line' && st.manualLength==null){
            const pxLen = Math.hypot(st.x2-st.x1, st.y2-st.y1);
            st.manualLength = pxLen * s.calibScale;
            filled++;
          }
        });
        if(filled===0) alert('Every line already has a measurement.');
        renderSketchOverlay();
      }
      if(action==='switch-page'){ switchToSketchPage(el.dataset.page); }
      if(action==='add-page'){ addNewSketchPage(); }
      if(action==='rename-page'){ renameCurrentSketchPage(); }
      if(action==='delete-page'){ deleteCurrentSketchPage(); }
      if(action==='toggle-magnet'){ s.magnetOn = !s.magnetOn; renderSketchOverlay(); }
      if(action==='toggle-link'){ s.linkCorners = (s.linkCorners===false); renderSketchOverlay(); }
      if(action==='zoom-in'){ s.zoom = Math.min(3, s.zoom+0.25); renderSketchOverlay(); }
      if(action==='zoom-out'){ s.zoom = Math.max(0.5, s.zoom-0.25); renderSketchOverlay(); }
      if(action==='undo'){ s.strokes.pop(); detectRooms(); renderSketchOverlay(); }
      if(action==='clear-all'){ if(confirm('Clear the entire sketch?')){ s.strokes=[]; s.calibScale=null; s.rooms=[]; renderSketchOverlay(); } }
      if(action==='close-sketch'){ if(s.readOnly || confirm('Close without saving? Any changes will be lost.')) closeSketchEditor(); }
      if(action==='save-sketch'){ saveSketchAndClose(); }
      if(action==='delete-this-sketch'){
        const c = s.ctx; const f = c && DB.onsite.find(x=>x.id===c.id); const x = f && ensureSketches(f).find(k=>k.id===c.sid);
        if(f && x && confirm('Delete "'+(x.name||'this sketch')+'" for '+f.clientName+'? This can\'t be undone.')){
          closeSketchEditor(); f.sketches = f.sketches.filter(k=>k.id!==x.id); syncPrimarySketch(f); saveRecord('onsite', f); render();
        }
      }
    });
  });
}
function saveSketchAndClose(){
  const s = STATE.sketchEditor;
  syncActivePageFromState();
  const canvas = document.getElementById('sketch-canvas');
  const snapshot = canvas.toDataURL('image/png'); // snapshot of whichever page was showing when Save was pressed
  const data = { pages: s.pages, activePageId: s.activePageId, snapshot };
  if(s.onSave) s.onSave(data);
  closeSketchEditor();
}

   Every page that existed before is still here, with the same permission it always needed. */
function navGroups(){
  const p = perms();
  const groups = [
    {key:'home',   label:'Home',              pages:[['home','Home',true]]},
    {key:'sales',  label:'Sales & Contracts', pages:[['onsite','On-Site & Contracts',true],['materials','Materials',!!p.onsiteReview],['legaldocs','Contract Templates',!!p.manageContractTemplates]]},
    {key:'jobs',   label:'Jobs',              pages:[['today','Today',true],['calendar','Calendar',!!p.calendar],['projects','Projects',!!p.projects],['sketches','Sketches',!!(p.onsiteSubmit||p.onsiteReview)]]},
    {key:'people', label:'People',            pages:[['clients','Clients',!!p.clients],['vendors','Vendors',!!p.vendors],['team','Team',!!(p.manageTeam||p.manageRoles)],['reviews','Reviews',true]]},
  ];
  groups.forEach(g=>{ g.pages = g.pages.filter(x=>x[2]); });
  return groups.filter(g=>g.pages.length);
}
const NAV_VIEW_ALIAS = {roles:'team'};   // pages opened from inside another page light up that page's tab
function navCurrent(groups){
  const v = NAV_VIEW_ALIAS[STATE.view] || STATE.view;
  for(const g of groups){ if(g.pages.some(x=>x[0]===v)) return {group:g, page:v}; }
  return {group:null, page:v};
}
function navBarsHTML(){
  const groups = navGroups();
  const cur = navCurrent(groups);
  STATE.navLast = STATE.navLast || {};
  if(cur.group) STATE.navLast[cur.group.key] = cur.page;
  const top = groups.map(g=>{
    const last = STATE.navLast[g.key];
    const target = g.pages.some(x=>x[0]===last) ? last : g.pages[0][0];
    return `<button data-nav="${target}" class="${cur.group===g?'active':''}">${g.label}</button>`;
  }).join('');
  const sub = (cur.group && cur.group.pages.length>1)
    ? `<div class="subnav">${cur.group.pages.map(x=>`<button data-nav="${x[0]}" class="${cur.page===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>`
    : '';
  return {top, sub};
}
let _logoUrl = null;
function logoUrl(){   // the logo is decoded once and reused, instead of re-sending 30 KB of text on every screen refresh
  if(_logoUrl) return _logoUrl;
  try{
    const b64 = LOGO.split(',')[1]; const bin = atob(b64); const u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    _logoUrl = URL.createObjectURL(new Blob([u], {type:'image/png'}));
  }catch(e){ _logoUrl = LOGO; }
  return _logoUrl;
}

function attachCompanyGateHandlers(){
  const sendBtn = document.querySelector('[data-action="send-gate-link"]');
  if(sendBtn) sendBtn.addEventListener('click', async ()=>{
    const email = (val('gate-email')||'').trim();
    if(!email || !email.includes('@')){ document.getElementById('gate-err').textContent = 'Enter a valid email address.'; return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    try{
      const actionCodeSettings = { url: window.location.href.split('?')[0], handleCodeInApp: true, linkDomain: 'auth.gsbconstructions.com', iOS: { bundleId: 'io.github.gsbgeneralconstruction' } };
      await fbAuth.sendSignInLinkToEmail(email, actionCodeSettings);
      localStorage.setItem('gsb2-gate-email', email);
      STATE.companyGate = { sent:true, email };
      showGateScreen();
    }catch(err){
      document.getElementById('gate-err').textContent = 'Could not send the link: ' + (err.message||err);
      sendBtn.disabled = false; sendBtn.textContent = 'Send Verification Link';
    }
  });
  const resendBtn = document.querySelector('[data-action="resend-gate-link"]');
  if(resendBtn) resendBtn.addEventListener('click', ()=>{ STATE.companyGate = null; showGateScreen(); });
}
const COMPANY_GATE_ENABLED = false; // temporarily off for iPad UI testing — flip back to true once you're done, quota resets daily
async function bootSequence(){
  const signToken = new URLSearchParams(window.location.search).get('sign');
  if(signToken){ await loadPublicSignPage(signToken); return; }
  if(!COMPANY_GATE_ENABLED){ loadAll(); return; }
  if(fbAuth.isSignInWithEmailLink(window.location.href)){
    let email = localStorage.getItem('gsb2-gate-email');
    if(!email){ email = prompt('Confirm the email you used to verify this device:'); }
    if(email){
      try{
        await fbAuth.signInWithEmailLink(email, window.location.href);
        localStorage.setItem('gsb2-company-verified', 'true');
        localStorage.removeItem('gsb2-gate-email');
        history.replaceState({}, document.title, window.location.pathname);
        loadAll();
        return;
      }catch(err){
        document.getElementById('app').innerHTML = `<div class="loading">That verification link didn't work — it may have expired or already been used.<br><span class="mono" style="font-size:11px;">${esc(err.message||err)}</span><br><br>Go back and request a new link.</div>`;
        return;
      }
    }
  }
  if(localStorage.getItem('gsb2-company-verified') === 'true'){ loadAll(); return; }
  showGateScreen();
}

function attachLoginHandlers(){
  const btn = document.querySelector('[data-action="do-login"]');
  if(btn) btn.addEventListener('click', ()=>{
    const first=val('lg-first').trim(), last=val('lg-last').trim(), code=val('lg-code').trim();

    if(!match){ document.getElementById('lg-err').textContent = 'Name or code not recognized. Check with your office for your login details.'; return; }
    STATE.user = match; render();
  });
  const createOwnerBtn = document.querySelector('[data-action="create-owner"]');
  if(createOwnerBtn) createOwnerBtn.addEventListener('click', async ()=>{
    const first=val('co-first').trim(), last=val('co-last').trim(), code=val('co-code').trim();
    if(!first || !last){ document.getElementById('lg-err').textContent = 'First and last name required.'; return; }
    if(!code || code.length<4){ document.getElementById('lg-err').textContent = 'Choose a code at least 4 digits long.'; return; }
    const owner = { id: uid(), first, last, code, role:'owner' };
    DB.team.push(owner);
    await saveRecord('team', owner);
    STATE.user = owner;
    render();
  });
  const companyLogoutLink = document.querySelector('[data-action="logout-company"]');
  if(companyLogoutLink) companyLogoutLink.addEventListener('click', (e)=>{
    e.preventDefault();
    if(!confirm('Log this device out of GSB entirely? Anyone using this device will need to re-verify with a company email before logging in again.')) return;
    localStorage.removeItem('gsb2-company-verified');
    localStorage.removeItem('gsb2-gate-email');
    fbAuth.signOut().finally(()=> location.reload());
  });
}

const SYNC_KEYS = [['onsite','Worksheets'],['estimates','Estimates'],['contracts','Contracts'],['clients','Clients'],['changeOrders','Change orders'],['onsiteDrafts','Saved drafts']];
function syncLabel(k, r){ return (r.clientName||r.name||r.jobName||r.title||'') + (r.jobName&&r.clientName?' — '+r.jobName:'') + (r.date?' ('+r.date+')':'') || String(r.id); }

async function connectionTest(){
  const tests = [['Cloud database (firestore.googleapis.com)','https://firestore.googleapis.com/'],['Login service (identitytoolkit.googleapis.com)','https://identitytoolkit.googleapis.com/'],['Google files (www.gstatic.com)','https://www.gstatic.com/generate_204']];
  const res = await Promise.all(tests.map(async ([name,url])=>{
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null; const t = setTimeout(()=>{ try{ctl&&ctl.abort();}catch(e){} }, 8000);
    try{ await fetch(url, {mode:'no-cors', cache:'no-store', signal: ctl?ctl.signal:undefined}); clearTimeout(t); return [name,true]; }catch(e){ clearTimeout(t); return [name,false]; }
  }));
  let signedIn = false; try{ signedIn = !!(fbAuth && fbAuth.currentUser); }catch(e){}
  return {res, signedIn};
}
async function runSyncCheck(){
  const box = syncOverlay();
  box.innerHTML = '<h2 style="margin:0 0 8px;">Sync check</h2><div>Checking the cloud…</div>';
  if(!navigator.onLine){ box.innerHTML += '<div style="margin-top:10px;color:#8A5A1B;"><b>No signal.</b> Connect to Wi-Fi or data and try again.</div><button class="btn" id="sync-close" style="margin-top:12px;">Close</button>'; document.getElementById('sync-close').onclick = ()=>document.getElementById('sync-overlay').remove(); return; }
  const rows = []; const pending = [];
  for(const [k,label] of SYNC_KEYS){
    let cloud = null, err = null;
    try{
      const snap = await Promise.race([collectionFor(k).get({source:'server'}), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out after 20 seconds')),20000))]);
      cloud = new Set(); snap.forEach(d=>{ if(!d.metadata.hasPendingWrites) cloud.add(d.id); });
    }catch(e){ err = (e.code||'') + ' ' + (e.message||e); }
    const idf = RECORD_ID_FIELD[k];
    const local = DB[k] || [];
    const missing = cloud ? local.filter(r=>!cloud.has(String(r[idf]))) : [];
    missing.forEach(r=>pending.push({k,r}));
    rows.push({k,label,local:local.length,cloud:cloud?cloud.size:'?',missing,err});
  }
  const ob = (await OB.all()).filter(x=>x.k!=='notifications').length;
  const total = pending.length;
  const ct = await connectionTest();
  const connHtml = `<div style="margin:10px 0;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;"><b>Connection test</b>${ct.res.map(([n,ok])=>`<div style="color:${ok?'#2E5C3A':'#b3261e'};">${ok?'✓':'✗'} ${esc(n)}</div>`).join('')}<div style="color:${ct.signedIn?'#2E5C3A':'#b3261e'};">${ct.signedIn?'✓':'✗'} Signed in to the cloud</div>${ct.res.some(r=>!r[1])?'<div style="margin-top:6px;color:#8A5A1B;">A ✗ above means this network or a setting on this device is blocking Google. Try cellular data (turn Wi-Fi off), and turn off any VPN, iCloud Private Relay or content blocker.</div>':''}</div>`;
  box.innerHTML = `<h2 style="margin:0 0 4px;">Sync check</h2>
    <div style="color:#6b675c;margin-bottom:10px;">This device vs. the cloud (what your laptop sees).</div>
    ${connHtml}
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <tr style="text-align:left;border-bottom:1px solid #ddd;"><th style="padding:4px 0;">Item</th><th>On this device</th><th>In the cloud</th></tr>
      ${rows.map(r=>`<tr style="border-bottom:1px solid #eee;"><td style="padding:5px 0;">${esc(r.label)}</td><td>${r.local}</td><td>${r.err?'<span style="color:#b3261e;">error</span>':r.cloud}</td></tr>`).join('')}
    </table>
    ${rows.filter(r=>r.err).map(r=>`<div style="color:#b3261e;margin-top:6px;">⚠ ${esc(r.label)}: ${esc(r.err)}</div>`).join('')}
    ${total ? `<div style="margin-top:12px;padding:10px;background:#FFF4E0;border:1px solid #E7C98B;border-radius:8px;"><b>${total} item${total>1?'s are':' is'} on this device but NOT in the cloud:</b><ul style="margin:6px 0 0 18px;padding:0;">${pending.map(p=>`<li>${esc(p.r.clientName||p.r.name||'Item')} — ${esc(p.r.jobName||SYNC_KEYS.find(x=>x[0]===p.k)[1])}</li>`).join('')}</ul></div>
      <button class="btn" id="sync-send" style="margin-top:10px;">Send them to the cloud now</button><div id="sync-result" style="margin-top:8px;"></div>` : `<div style="margin-top:12px;color:#2E5C3A;"><b>✓ Everything on this device is in the cloud.</b>${ob?` (${ob} item(s) still in the send box — they will clear shortly.)`:''}</div>`}
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end;"><button class="btn ghost" id="sync-reload">Reload from cloud</button><button class="btn ghost" id="sync-close">Close</button></div>`;
  document.getElementById('sync-close').onclick = ()=>document.getElementById('sync-overlay').remove();
  document.getElementById('sync-reload').onclick = ()=>location.reload();
  const sendBtn = document.getElementById('sync-send');
  if(sendBtn) sendBtn.onclick = async ()=>{
    sendBtn.disabled = true; const out = document.getElementById('sync-result'); out.innerHTML = 'Sending…'; const lines = [];
    for(const p of pending){
      const name = (p.r.clientName||p.r.name||'Item')+' — '+(p.r.jobName||'');
      const kb = (()=>{ try{ return Math.round(JSON.stringify(p.r).length/1024); }catch(_){ return '?'; } })();
      const r = await strictSend(p.k, p.r);
      if(r.ok) lines.push(`<div style="color:#2E5C3A;">✓ Sent: ${esc(name)}</div>`);
      else lines.push(`<div style="color:#b3261e;">✗ ${esc(name)} — ${esc(r.err)} (size ${kb} KB before shrinking${r.raw&&r.raw.code?', code: '+esc(r.raw.code):''})</div>`);
    }
    out.innerHTML = lines.join('') + '<div class="subtle" style="margin-top:6px;">If anything shows ✗, take a screenshot of this and send it to Claude.</div>';
    obUpdateBadge();
  };
}
async function writeBlobsStrict(b){
  const col = fbDb.collection(BLOB_COLL); const n = Math.ceil(b.data.length/BLOB_CHUNK); const ps = [];
  if(n <= 1) ps.push(col.doc(b.id).set({id:b.id, n:1, d:b.data}));
  else { ps.push(col.doc(b.id).set({id:b.id, n})); for(let i=0;i<n;i++) ps.push(col.doc(b.id+'_'+i).set({id:b.id+'_'+i, d:b.data.slice(i*BLOB_CHUNK,(i+1)*BLOB_CHUNK)})); }
  await Promise.race([Promise.all(ps), new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('photo upload timed out'),{code:'timeout'})),15000))]);
  BLOB_SAVED.add(b.id);
}

function inlineFormat(text){
  // escape first (so users can't inject HTML), then restore **bold** markers as <b> tags
  return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function parseLiteMarkup(src){
  const lines = (src||'').split('\n');
  let html = '';
  let listBuffer = [];
  function flushList(){
    if(listBuffer.length){ html += '<ul>' + listBuffer.map(li=>`<li>${inlineFormat(li)}</li>`).join('') + '</ul>'; listBuffer = []; }
  }
  lines.forEach(line=>{
    const trimmed = line.trim();
    if(trimmed===''){ flushList(); return; }
    if(trimmed.startsWith('## ')){ flushList(); html += `<h4>${inlineFormat(trimmed.slice(3).trim())}</h4>`; return; }
    if(trimmed.startsWith('- ')){ listBuffer.push(trimmed.slice(2).trim()); return; }
    flushList();
    html += `<p>${inlineFormat(trimmed)}</p>`;
  });
  flushList();
  return html;
}

/* ================= 2.0 ESTIMATE DOCUMENT =================
   One layout used everywhere: on the iPad, on the client's link, in the calculator preview, and on paper.
   The client sees ONE price (permits folded in) — never materials, markup or hourly rates. */
function scopeItems(text){
  return String(text||'').split('\n').map(l=>l.replace(/^\s*(?:[-•*·]|\d+[.)])\s*/,'').trim()).filter(Boolean);
}
function scopeListHTML(text){
  const items = scopeItems(text);
  if(!items.length) return '';
  if(items.length===1) return `<p class="est-p">${esc(items[0])}</p>`;
  return `<ol class="est-ol">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
}
function estimateScopeParts(e){
  return [['Demolition',e.demo],['Construction & Installation',e.constr],['Electrical & Plumbing',e.ep],['Owner-Provided Items — supplied by the Owner, not included in the price',e.owner]]
    .filter(x=>x[1] && String(x[1]).trim());
}
function estimateNumber(e){ return (e && e.id && e.id!=='preview') ? 'E-'+String(e.id).slice(-6).toUpperCase() : '(assigned when saved)'; }
function estimateValidUntil(e){
  try{ const d = new Date((e.date||todayStr())+'T12:00:00'); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); }catch(err){ return ''; }
}

const PAY_PCT = {p1:10,p2:40,p3:15,p4:12,p5:10,p6:8,p7:5};

function payLabelsFor(c){
  if(c && c.payLabels) return c.payLabels;

function paymentSchedule(total){
  total = parseFloat(total)||0;
  const p1=Math.round(total*0.10), p2=Math.round(total*0.40), p3=Math.round(total*0.15), p4=Math.round(total*0.12), p5=Math.round(total*0.10), p6=Math.round(total*0.08);
  return { total, p1, p2, p3, p4, p5, p6, p7: total-(p1+p2+p3+p4+p5+p6) };
}

    .sub{text-align:center;color:#6B6455;font-size:12px;margin-bottom:18px;}
    table{width:100%;border-collapse:collapse;margin:10px 0;}
    td{padding:6px 4px;border-bottom:1px solid #ddd;font-size:13px;}
    .legal{font-size:11.5px;line-height:1.5;border:1px solid #ddd;padding:12px 14px;border-radius:4px;margin-top:10px;}
    .legal h4{font-size:12px;margin:10px 0 3px;text-transform:uppercase;color:#7A6A45;}
    img.sig{height:85px;margin-top:6px;}
    .lbl{color:#6B6455;font-size:10.5px;text-transform:uppercase;}
    .contract-page{page-break-after:always;break-after:page;page-break-inside:avoid;padding-bottom:4px;}
    .contract-page:last-child{page-break-after:auto;break-after:auto;}
    .contract-page h4{margin:10px 0 3px;}
    .contract-page p{margin:5px 0;}
    .page-initials{margin-top:26px;border-top:1px solid #ccc;padding-top:8px;font-size:11px;color:#6B6455;display:flex;justify-content:space-between;}
    .page-initials b{color:#2A261E;font-size:13px;letter-spacing:1px;}
    .page-footer{margin-top:6px;font-size:9.5px;color:#999;text-align:center;}
  </style></head><body>${bodyHtml}<script>window.onload=()=>{
    // size all contract pages together (same text size on every page) so the tallest one still fits on one sheet
    var pages = Array.prototype.slice.call(document.querySelectorAll('.contract-page'));
    if(pages.length){
      var MAXH = 9.4*96, tallest = 1;
      pages.forEach(function(p){ p.style.zoom = 1; tallest = Math.max(tallest, p.offsetHeight); });
      var z = Math.max(0.6, Math.min(1.3, (MAXH/tallest)*0.97));
      pages.forEach(function(p){ p.style.zoom = z; });
    }
    window.print();
  }<\/script></body></html>`);
  w.document.close();
}

/* ================= PRICING CALCULATOR ================= */
function calcMaterialsSubtotal(pb){
  return (pb.materialLines||[]).reduce((sum,line)=>{
    return sum + (parseFloat(line.unitPrice)||0) * (parseFloat(line.qty)||0);
  }, 0);
}
function calcSubsSubtotal(pb){
  return (pb.subLines||[]).reduce((sum,line)=> sum + (parseFloat(line.price)||0), 0);
}
function calcVendorsSubtotal(pb){
  return (pb.vendorLines||[]).reduce((sum,line)=> sum + (parseFloat(line.price)||0), 0);
}
function calcPricingTotals(pb){
  ensurePricingDefaults(pb);
  const licenseFee = parseFloat(pb.licenseFee)||0;
  const inspectionsTotal = (parseFloat(pb.inspectionCount)||0) * (parseFloat(pb.inspectionRate)||0);
  const finishesTotal = calcFinishesTotal(pb);
  const measureBase = calcMeasureTotal(pb);
  const measureTotal = measureBase * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  const materialsBase = calcMaterialsSubtotal(pb);
  const materialsWithMarkup = materialsBase * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  const laborHourly = (parseFloat(pb.laborRate)||0) * (parseFloat(pb.laborHours)||0);
  const laborFlatTotal = calcLaborFlatTotal(pb);
  const laborTotal = laborHourly + laborFlatTotal;
  const subsBase = calcSubsSubtotal(pb);
  const subsWithMarkup = subsBase * (1 + (parseFloat(pb.subsMarkupPct)||0)/100);
  const vendorsBase = calcVendorsSubtotal(pb);
  const vendorsWithMarkup = vendorsBase * (1 + (parseFloat(pb.vendorsMarkupPct)||0)/100);
  const preTax = materialsWithMarkup + laborTotal + subsWithMarkup + vendorsWithMarkup + licenseFee + inspectionsTotal + finishesTotal + measureTotal;
  const taxAmount = preTax * (parseFloat(pb.taxPct)||0)/100;
  const grandTotal = preTax + taxAmount;
  return { materialsBase, materialsWithMarkup, laborTotal, laborHourly, laborFlatTotal, subsBase, subsWithMarkup, vendorsBase, vendorsWithMarkup, licenseFee, inspectionsTotal, finishesTotal, measureBase, measureTotal, preTax, taxAmount, grandTotal };
}
function calcPricingTotalsByCategory(pb){
  const cats = { demo:0, construction:0, ep:0 };
  (pb.materialLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    const lineTotal = (parseFloat(line.unitPrice)||0)*(parseFloat(line.qty)||0);
    cats[cat] += lineTotal * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  });
  (pb.subLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    cats[cat] += (parseFloat(line.price)||0) * (1 + (parseFloat(pb.subsMarkupPct)||0)/100);
  });
  (pb.vendorLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    cats[cat] += (parseFloat(line.price)||0) * (1 + (parseFloat(pb.vendorsMarkupPct)||0)/100);
  });
  cats.construction += (parseFloat(pb.laborRate)||0) * (parseFloat(pb.laborHours)||0) + calcLaborFlatTotal(pb); // labor always counts as construction
  cats.construction += calcMeasureTotal(pb) * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  const taxMult = 1 + (parseFloat(pb.taxPct)||0)/100;
  return { demo: cats.demo*taxMult, construction: cats.construction*taxMult, ep: cats.ep*taxMult };
}
function defaultPricingBreakdown(){
  return { materialLines:[], materialsMarkupPct:0, laborRate:0, laborHours:0, subLines:[], subsMarkupPct:0, vendorLines:[], vendorsMarkupPct:0, taxPct:0, licenseFee:2000, inspectionCount:0, inspectionRate:200, finishLines:[], laborFlatLines:[], measureLines:[] };
}
function ensurePricingDefaults(pb){
  if(pb.licenseFee===undefined) pb.licenseFee = 2000;
  if(pb.inspectionCount===undefined) pb.inspectionCount = 0;
  if(pb.inspectionRate===undefined) pb.inspectionRate = 200;
  if(!Array.isArray(pb.finishLines)) pb.finishLines = [];
  if(!Array.isArray(pb.laborFlatLines)) pb.laborFlatLines = [];
  if(!Array.isArray(pb.measureLines)) pb.measureLines = [];
  if(pb.measureLines.length){      // LF/SF items now live in the Materials list — move any that were entered separately
    pb.measureLines.forEach(l=>{ pb.materialLines.push({ id:l.id, materialId:(l.materialId && l.materialId!=='__other') ? l.materialId : '', customName:(l.materialId && l.materialId!=='__other') ? undefined : (l.name||''), unitPrice:l.rate, qty:l.qty, unitType:l.unit||'LF', store:l.store||'' }); });
    pb.measureLines = [];
  }
  return pb;
}
function calcMeasureTotal(pb){ return (pb.measureLines||[]).reduce((s,l)=> s + (parseFloat(l.rate)||0)*(parseFloat(l.qty)||0), 0); }
function calcLaborFlatTotal(pb){ return (pb.laborFlatLines||[]).reduce((s,l)=> s + (parseFloat(l.price)||0), 0); }
function pbEstimatePreview(pb){
  const totals = calcPricingTotals(pb);
  const total = Math.round(totals.grandTotal);
  const permitPart = Math.round(totals.licenseFee + totals.inspectionsTotal);
  const nIns = parseFloat(pb.inspectionCount)||0;
  const permitDetail = 'License flat fee ' + money(totals.licenseFee) + (nIns ? ' + ' + nIns + ' inspection' + (nIns===1?'':'s') + ' × ' + money(parseFloat(pb.inspectionRate)||0) : '');
  return { permitPart, total, permitDetail, pricing:{ permit:permitPart, constr:(total-permitPart) },
    finishes:(pb.finishLines||[]).filter(l=>(parseFloat(l.price)||0)>0).map(l=>({name:l.name||'Finish', price:parseFloat(l.price)||0})),
    laborFlats:(pb.laborFlatLines||[]).filter(l=>(parseFloat(l.price)||0)>0).map(l=>({name:l.name||'Labor', price:parseFloat(l.price)||0})) };
}
function calcFinishesTotal(pb){ return (pb.finishLines||[]).reduce((s,l)=> s + (parseFloat(l.price)||0), 0); }

function projectStatusForOnsite(f){
  for(const c of DB.clients){

  return f.archived ? 'signed' : 'ongoing';

/* Materials can be priced Each, per LF (linear foot) or per SF (square foot) */
const UNIT_TYPES = { each:{label:'Each / unit', short:'unit'}, LF:{label:'Per LF (linear foot)', short:'LF'}, SF:{label:'Per SF (square foot)', short:'SF'} };
function guessUnitType(m){
  if(!m) return 'each';
  const t = (m.name+' '+(m.size||'')).toLowerCase();
  if(/\bbase\s?board|crown|casing|molding|moulding|chair rail|quarter round|corner round|shoe mold|base cap|cove base|backer rod|trim board|\bwire\b|romex|conduit|\bpipe\b|tubing|gutter|flashing|j-bead|corner bead|\blf\b|linear/.test(t)) return 'LF';
  if(/\btile\b|flooring|laminate|vinyl plank|\bcarpet|insulation|underlayment|backer board|paneling|\bsf\b|square f/.test(t)) return 'SF';
  return 'each';
}
/* Copy a material's name so it can be pasted straight into a search */
async function copyTextToClipboard(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
document.addEventListener('click', async (e)=>{
  const c = e.target.closest && e.target.closest('[data-copy]'); if(!c) return;
  e.preventDefault(); const text = c.getAttribute('data-copy');
  const ok = await copyTextToClipboard(text);
  try{ showToast(ok ? '📋 Copied: '+text : 'Could not copy — press and hold the name to copy it'); }catch(_){}
});

function storeSuggestions(){
  const base = ['Home Depot','Lowe\'s','Ferguson','Floor & Decor','Sherwin-Williams','Builders FirstSource','84 Lumber','Supplier (call-in)'];
  const seen = new Set(base.map(x=>x.toLowerCase())); const out = base.slice();
  DB.onsite.forEach(f=>(((f.pricingBreakdown&&f.pricingBreakdown.materialLines)||[]).concat((f.pricingBreakdown&&f.pricingBreakdown.measureLines)||[])).forEach(l=>{ const t=(l.store||'').trim(); if(t && !seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); out.push(t); } }));
  return out;
}
function shoppingListHTML(f){
  const pbk = f.pricingBreakdown || {};
  const lines = ((pbk.materialLines) || []).filter(l=>l.materialId || l.customName || l.store);
  if(!lines.length) return '';
  const groups = {};
  lines.forEach(l=>{ const k = (l.store||'').trim() || 'Store not set yet'; (groups[k] = groups[k]||[]).push(l); });
  const names = Object.keys(groups).sort((a,b)=> a==='Store not set yet' ? 1 : b==='Store not set yet' ? -1 : a.localeCompare(b));
  return `<div class="section-label">🛒 Where to Buy Materials <span class="tag pending" style="margin-left:6px;">Internal — not on the client estimate</span></div>
    <div class="card" style="padding:6px 16px;">${names.map(n=>{
      const ls = groups[n]; const sub = ls.reduce((a,l)=>a+(parseFloat(l.unitPrice)||0)*(parseFloat(l.qty)||0),0);
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line);"><div style="display:flex;justify-content:space-between;gap:8px;"><b>${esc(n)}</b><span class="subtle">Cost at this store: <b>${money(sub)}</b></span></div>
        ${ls.map(l=>{ const m = DB.materials.find(x=>x.id===l.materialId); return `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">${matThumbHTML(m,30)}<span style="flex:1;min-width:0;">${m?esc(m.name)+(m.size?' ('+esc(m.size)+')':''):(l.customName?esc(l.customName):'(material not picked)')}</span>${(m||l.customName)?`<button type="button" class="btn ghost small" data-copy="${esc(m?(m.name+(m.size?' '+m.size:'')):l.customName)}">📋</button>`:''}<span class="subtle">${esc(String(l.qty||'—'))}${(l.unitType&&l.unitType!=='each')?' '+l.unitType:''} × ${l.unitPrice?money(parseFloat(l.unitPrice)):'—'}${(l.unitType&&l.unitType!=='each')?'/'+l.unitType:''}</span></div>`; }).join('')}</div>`; }).join('')}
    </div>`;
}

/* ================= MATERIAL PICKER (search + pictures) for the Pricing Calculator ================= */
function openMatPicker(lineId, target){
  const f = DB.onsite.find(x=>x.id===STATE.pricingCalcOnsiteId); if(!f || !f.pricingBreakdown) return;
  const isMeasure = target==='measure';
  const line = ((isMeasure ? f.pricingBreakdown.measureLines : f.pricingBreakdown.materialLines)||[]).find(l=>l.id===lineId); if(!line) return;
  const old = document.getElementById('matpicker'); if(old) old.remove();
  const all = matList();
  let cat = '', q = '', limit = 80;
  const ov = document.createElement('div'); ov.id = 'matpicker';
  ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:3vh 12px;overflow:auto;';
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;width:100%;max-width:820px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:94vh;">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);">
      <b style="font-size:16px;flex:1;">Pick a material</b>
      <button type="button" class="btn ghost small" id="mp-close">✕ Close</button>
    </div>
    <div style="padding:10px 14px 4px;"><input id="mp-q" type="search" autocomplete="off" placeholder="🔍 Search — e.g. 5/8 drywall, stud, screws, baseboard" style="width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:7px;"></div>
    <div id="mp-cats" style="display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px 8px;"></div>
    <div id="mp-list" style="overflow:auto;padding:4px 14px 14px;"></div>
  </div>`;
  document.body.appendChild(ov);
  const $ = id => ov.querySelector('#'+id);
  const words = () => q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = m => { const w = words(); return (!cat || (m.category||'')===cat) && (!w.length || w.every(x => (m.name+' '+(m.size||'')+' '+(m.category||'')+' '+(m.unit||'')).toLowerCase().includes(x))); };
  function paint(){
    const cats = [''].concat(MAT_CATS);
    $('mp-cats').innerHTML = cats.map(c=>`<button type="button" data-mpcat="${esc(c)}" class="btn small ${c===cat?'':'ghost'}">${c?esc(c):'All'}</button>`).join('');
    const items = all.filter(hit).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    const shown = items.slice(0, limit);
    $('mp-list').innerHTML = items.length===0 ? '<div class="subtle" style="padding:14px 0;">Nothing matches. Try fewer words, or close this and use “+ Create New Material”.</div>' :
      `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;">${shown.map(m=>`
        <button type="button" data-mppick="${m.id}" style="display:flex;gap:10px;align-items:center;text-align:left;padding:8px;border:1px solid ${m.id===line.materialId?'var(--gold,#8A6D1B)':'var(--line)'};border-radius:9px;background:#fff;cursor:pointer;">
          ${matThumbHTML(m, 56)}
          <span style="min-width:0;"><b style="display:block;font-size:13.5px;line-height:1.25;">${esc(m.name)}</b><span class="subtle" style="font-size:12px;">${esc(m.size||'')}${m.category?(m.size?' · ':'')+esc(m.category):''}</span></span>
        </button>`).join('')}</div>` +
      (items.length>shown.length ? `<div style="text-align:center;margin-top:10px;"><button type="button" class="btn ghost small" id="mp-more">Show more (${items.length-shown.length} more) — or type to narrow it down</button></div>` : '');
  }
  const close = ()=>{ ov.remove(); };
  let _lastPick = 0;
  function choose(p){
    if(Date.now()-_lastPick < 600) return; _lastPick = Date.now();
    // look the line up again right now (the page's data can be refreshed while the picker is open)
    const ff = DB.onsite.find(x=>x.id===STATE.pricingCalcOnsiteId);
    const cur = ff && ff.pricingBreakdown && ((isMeasure ? ff.pricingBreakdown.measureLines : ff.pricingBreakdown.materialLines)||[]).find(l=>l.id===lineId);
    if(!cur){ try{ showToast('Could not find that line — please add it again.'); }catch(e){} close(); return; }
    cur.materialId = p.dataset.mppick;
    const pm = DB.materials.find(x=>x.id===cur.materialId);
    cur.unitType = guessUnitType(pm); if(cur.customName!==undefined) delete cur.customName;
    close();
    schedulePricingAutosave();
    render();
    try{ showToast('✓ Selected: ' + (pm ? pm.name : 'material')); }catch(e){}
    setTimeout(()=>{ const pr = document.querySelector('[data-pricing-action="'+(isMeasure?'set-measure-rate':'set-material-price')+'"][data-line="'+lineId+'"]'); if(pr){ pr.focus(); try{ pr.scrollIntoView({block:'center'}); }catch(e){} } }, 60);
  }
  // select on finger/mouse release as well as on click: on a tablet the first tap can only close the keyboard, and the click gets lost
  ov.addEventListener('pointerup', (e)=>{ const p = e.target.closest && e.target.closest('[data-mppick]'); if(p){ e.preventDefault(); choose(p); } });
  ov.addEventListener('click', (e)=>{
    if(e.target === ov || e.target.closest('#mp-close')){ close(); return; }
    const c = e.target.closest('[data-mpcat]'); if(c){ cat = c.dataset.mpcat; limit = 80; paint(); return; }
    if(e.target.closest('#mp-more')){ limit += 120; paint(); return; }
    const p = e.target.closest('[data-mppick]');
    if(p){ choose(p); }
  });
  $('mp-q').addEventListener('input', (e)=>{ q = e.target.value; limit = 80; paint(); });
  paint();
  setTimeout(()=>{ try{ $('mp-q').focus(); }catch(e){} }, 50);
}

  const b = e.target.closest && e.target.closest('[data-matpick]');
  if(b){ e.preventDefault(); openMatPicker(b.dataset.matpick, b.dataset.mattarget); }
});

function matList(){ return DB.materials.filter(m=>!m.system); }
/* Material picker for the Pricing Calculator: full scrolling list, or filtered while you type in the search box */
function matOptionsHTML(selectedId, query){
  const words = String(query||'').toLowerCase().split(/\s+/).filter(Boolean);
  const hit = m => !words.length || words.every(w => (m.name+' '+(m.size||'')+' '+(m.category||'')+' '+(m.unit||'')).toLowerCase().includes(w));
  const opt = m => `<option value="${m.id}" ${selectedId===m.id?'selected':''}>${esc(m.name)}${m.size?' ('+esc(m.size)+')':''}</option>`;
  const all = matList();
  let html = words.length ? '' : '<option value="">— Choose Material —</option>';
  let count = 0;
  const cats = MAT_CATS.concat(['']);   // '' = anything without a known category
  cats.forEach(cn=>{
    const its = all.filter(m=> (cn ? (m.category||'')===cn : !MAT_CATS.includes(m.category||'')) && hit(m)).sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
    if(!its.length) return;
    count += its.length;
    html += `<optgroup label="${esc(cn||'Other')}">${its.map(opt).join('')}</optgroup>`;
  });
  if(words.length && !count) html = '<option value="" disabled>No materials match — try fewer words</option>';
  return html;
}
document.addEventListener('input', (e)=>{
  const inp = e.target && e.target.closest ? e.target.closest('[data-mat-search]') : null;
  if(!inp) return;
  const sel = document.getElementById('matsel-'+inp.dataset.matSearch); if(!sel) return;
  const f = DB.onsite.find(x=>x.id===STATE.pricingCalcOnsiteId);
  const line = f && f.pricingBreakdown && (f.pricingBreakdown.materialLines||[]).find(l=>l.id===inp.dataset.matSearch);
  const q = inp.value.trim();
  sel.innerHTML = matOptionsHTML(line ? line.materialId : '', q);
  if(q){ const rows = sel.querySelectorAll('option').length; sel.size = Math.max(2, Math.min(9, rows)); }
  else { sel.removeAttribute('size'); sel.size = 0; }
});

async function seedStandardMaterials(force){
  const have = new Set(DB.materials.map(m=>m.id));
  const offline = (typeof navigator!=='undefined' && navigator.onLine===false);
  const batches = [ {marker:MAT_SEED_MARKER, items:STD_MATERIALS}, {marker:MAT_SEED_MARKER2, items:STD_MATERIALS_V2}, {marker:MAT_SEED_MARKER3, items:STD_MATERIALS_V3}, {marker:MAT_SEED_MARKER4, items:STD_MATERIALS_V4} ];
  const added = [];
  for(const bt of batches){
    if(!force){ if(have.has(bt.marker)) continue; if(offline) continue; }   // never seed from an empty offline cache
    bt.items.forEach(s=>{
      const id = stdMatId(s);
      if(have.has(id)) return;
      have.add(id);
      const rec = { id, name:s[1], size:s[2], category:s[0], icon:s[3], std:true };
      DB.materials.push(rec); added.push(rec);
    });
    if(!have.has(bt.marker)){ have.add(bt.marker); const mk = { id:bt.marker, system:true, name:'(seeded)' }; DB.materials.push(mk); added.push(mk); }
  }
  const items = added.filter(r=>!r.system), marks = added.filter(r=>r.system);
  for(let i=0;i<items.length;i+=40){ await Promise.all(items.slice(i,i+40).map(r=>saveRecord('materials', r).catch(()=>{}))); }
  for(const r of marks){ try{ await saveRecord('materials', r); }catch(e){} }
  return items.length;
}

function checkupStatus(project){
  if(!project.completed || !project.completedDate) return {hasCompleted:false};
  const dueDate = new Date(project.completedDate+'T00:00:00'); dueDate.setMonth(dueDate.getMonth()+6);
  const diffDays = Math.round((dueDate - new Date())/(1000*60*60*24));
  return {hasCompleted:true, dueDate:dueDate.toISOString().slice(0,10), daysLeft:diffDays, overdue: diffDays<=0};
}
function renderClients(){
  const p = perms();
  if(STATE.activeClientId){ const c = DB.clients.find(x=>x.id===STATE.activeClientId); if(c) return clientDetailView(c); }
  const clients = [...DB.clients].sort((a,b)=>a.name.localeCompare(b.name));
  return `
    <div class="section-head"><div><h1 class="page-title">Clients</h1><div class="subtle" style="margin-bottom:0">${clients.length} clients on file</div></div></div>
    <button class="btn" style="margin-bottom:12px;" data-action="add-new-client">+ Add New Client</button>
    <div class="card" style="padding:8px 20px;">
      ${clients.map(c=>{
        const flagged = c.projects.some(pr=>{const cs=checkupStatus(pr); return cs.overdue && !pr.checkupLetterSent;});
        return `<div class="list-row">
          <div class="main"><b>${esc(c.name)}</b> ${c.company?`<span style="color:var(--muted);font-size:13px"> — ${esc(c.company)}</span>`:''}
            <div class="meta">${c.propertyAddress ? esc(c.propertyAddress)+' &nbsp;·&nbsp; ' : ''}${c.projects.length} project${c.projects.length===1?'':'s'}</div></div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${flagged?`<span class="tag overdue">CHECK-UP DUE</span>`:''}
            <button class="btn ghost small" data-action="del-client" data-id="${c.id}">Delete</button>
            <button class="btn ghost small" data-action="open-client" data-id="${c.id}">Open</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function progressBar(project){
  const stages = [
    {label:'Estimate', on: project.estimateSigned},
    {label:'Contract', on: project.contractSigned},
    {label:'Permits', on: project.permitStatus==='approved' || project.permitStatus==='not_required', partial: project.permitStatus==='sent'},
    {label:'Building', on: project.constructionInProgress},
    {label:'Done', on: project.completed},
  ];
  return `
    <div class="progress-wrap">
      <div class="progress-track">${stages.map(s=>`<div class="progress-seg ${s.on?'on':s.partial?'partial':''}"></div>`).join('')}</div>
      <div class="progress-labels">${stages.map(s=>`<span>${s.label}</span>`).join('')}</div>
    </div>`;
}
